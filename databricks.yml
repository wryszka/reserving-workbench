bundle:
  name: reserving-workbench

variables:
  catalog:
    description: Unity Catalog name for all demo objects (portability anchor — change this one var to redeploy elsewhere)
    default: lr_dev_aws_us_catalog
  schema:
    description: Schema name for all reserving-workbench objects (fixed across workspaces)
    default: reserving_workbench
  warehouse_id:
    description: SQL warehouse used by the app + scripts for data queries
    default: "a3b61648ea4809e3"
  entity_name:
    description: The insurer
    default: "Bricksurance SE"
  fm_endpoint:
    description: Foundation Model API endpoint backing the Senior Reserving Actuary agent + narration (must support batch ai_query)
    default: "databricks-claude-sonnet-5"
  app_service_principal_id:
    description: Databricks App service principal (grants applied imperatively) — set after first app create
    default: ""
  genie_space_id:
    description: AI/BI Genie space "Reserving Workbench — Ask the Triangle" — set after creation (blank hides the tile)
    default: ""
  dashboard_id:
    description: Lakeview dashboard "Reserving Workbench — Committee View" — set after publish (blank hides the embed)
    default: ""
  use_cache:
    description: Switchable latency aid wrapping LLM narration only (never structured outputs)
    default: "true"

# Asset-labelling anchor: bundle.name + the bxc_* tags applied in the setup
# notebook mean every deployed object announces it belongs to reserving-workbench.
# See docs/ASSET_LABELLING.md. Catalog is the portability anchor: redeploy
# elsewhere by overriding --var catalog=<other_catalog>.
targets:
  dev:
    mode: development
    default: true
    workspace:
      host: https://fevm-lr-dev-aws-us.cloud.databricks.com
      profile: DEV
    variables:
      catalog: lr_dev_aws_us_catalog
      warehouse_id: "a3b61648ea4809e3"

  # CENTRAL / SHAREABLE deployment — assets in /Workspace/Shared, production mode
  # strips the dev_<user>_ prefix so any SA can demo/redeploy. Mirrors ifrs17 + underwriting.
  shared:
    mode: production
    workspace:
      host: https://fevm-lr-dev-aws-us.cloud.databricks.com
      profile: DEV
      root_path: /Workspace/Shared/reserving_workbench
    run_as:
      user_name: laurence.ryszka@databricks.com
    variables:
      catalog: lr_dev_aws_us_catalog
      warehouse_id: "a3b61648ea4809e3"

resources:
  apps:
    reserving_workbench_app:
      name: reserving-workbench
      description: "Reserving Workbench — governed actuarial reserving for Bricksurance SE (methodology library, validation, expert judgement, LDF selection, reserve→QRT lineage)."
      source_code_path: ../app
