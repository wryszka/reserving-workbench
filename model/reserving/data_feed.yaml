kind: entity
name: 1_raw_data_feed
domain: reserving
title: Data Feed (Ingestion)
description: >
  The source feeds a reserving close depends on — claims, premium, exposure,
  reference — with their arrival status, row counts and where they came from.
  This is the ingestion control surface: an actuary sees at a glance whether the
  data they need has landed, is late, or is quarantined, before any reserving
  work begins. Everyone struggles with this; it is the first thing a reserving
  actuary looks at on the Monday of close.
grain: One row per source feed per valuation date.
tags:
  project: reserving-workbench
  layer: raw
  gen: gen1
  domain: reserving
attributes:
  - name: feed_id
    type: string
    required: true
    description: Identifier for the feed.
    classification: internal
  - name: feed_name
    type: string
    required: true
    description: Business name of the feed (e.g. 'Claims — One Shield', 'Premium — Discovery').
    classification: internal
  - name: source_system_code
    code_set: source_system
    required: true
    description: The system the feed comes from.
    classification: internal
  - name: valuation_date
    type: date
    required: true
    description: The close the feed is for.
    classification: internal
  - name: rows_received
    type: integer
    required: true
    description: Row count received.
    classification: internal
  - name: rows_expected
    type: integer
    required: false
    description: Row count expected (from the prior period / control total).
    classification: internal
  - name: arrived_at
    type: timestamp
    required: false
    description: When the feed landed; null if not yet arrived.
    classification: internal
  - name: status
    type: string
    required: true
    description: Feed status — arrived / late / quarantined / accepted.
    classification: internal
  - name: dq_pass_pct
    type: decimal(5,2)
    required: false
    description: Percentage of data-quality expectations passed.
    classification: internal
  - name: sla_due_at
    type: timestamp
    required: false
    description: >
      When the feed was contractually due for this close. Arrival against SLA is
      what makes 'the data landed late' a measured fact with an owner rather than
      a recurring complaint.
    classification: internal
  - name: months_expected
    type: integer
    required: false
    description: Months of history the feed should carry for this close.
    classification: internal
  - name: months_present
    type: integer
    required: false
    description: >
      Months actually present. A gap here is a completeness failure that would
      otherwise show up much later as an inexplicably light development cell.
    classification: internal
  - name: data_domain
    type: string
    required: false
    description: The data domain this feed belongs to, for the data sign-off gate.
    classification: internal
keys:
  primary: [feed_id]
owner: Chief Actuary
