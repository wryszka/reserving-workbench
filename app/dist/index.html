<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Reserving Workbench — Bricksurance SE</title>
<style>
  :root{
    --slate:#1e293b; --slate2:#0f172a; --blue:#2563eb; --blue4:#60a5fa; --blue7:#1d4ed8;
    --ink:#0f172a; --mut:#64748b; --line:#e2e8f0; --bg:#f8fafc; --card:#fff;
    --red:#dc2626; --redbg:#fef2f2; --amber:#d97706; --ambbg:#fffbeb;
    --green:#16a34a; --greenbg:#f0fdf4; --violet:#6d28d9; --violetbg:#ede9fe;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    color:var(--ink);background:var(--bg);font-size:13px;line-height:1.55}
  .app{display:flex;min-height:100vh}
  /* sidebar */
  .sidebar{width:264px;background:linear-gradient(180deg,#1e293b 0%,#172033 100%);color:#cbd5e1;
    flex-shrink:0;display:flex;flex-direction:column;position:fixed;height:100vh;
    border-right:1px solid rgba(255,255,255,.06);z-index:5}
  .brand{display:flex;align-items:center;gap:11px;padding:16px;border-bottom:1px solid rgba(255,255,255,.08);cursor:pointer;color:inherit}
  .brand:hover{background:rgba(255,255,255,.03)}
  .logo{width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,#2563eb,#60a5fa);
    display:flex;align-items:center;justify-content:center;flex-shrink:0;box-shadow:0 2px 10px rgba(37,99,235,.4);color:#fff;font-weight:800}
  .brand .bt{font-weight:700;color:#fff;font-size:14px} .brand .bs{font-size:11px;color:#94a3b8;margin-top:1px}
  .nav{flex:1;padding:6px 10px;overflow:auto}
  .nav-section{font-size:10px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:#5b6878;padding:15px 10px 5px}
  .nav a{display:flex;align-items:center;gap:11px;padding:8.5px 11px;border-radius:9px;color:#cbd5e1;
    text-decoration:none;font-size:13.5px;margin:1px 0;cursor:pointer;transition:background .12s,color .12s}
  .nav a:hover{background:rgba(255,255,255,.06);color:#fff}
  .nav a.active{background:linear-gradient(135deg,#2563eb,#3b82f6);color:#fff;font-weight:600;box-shadow:0 2px 8px rgba(37,99,235,.35)}
  .nav a .ic{width:18px;text-align:center;opacity:.9}
  .side-foot{padding:14px 16px;border-top:1px solid rgba(255,255,255,.08);font-size:11px;color:#7c8797}
  .side-foot .st{display:inline-block;margin-top:6px;padding:2px 8px;border-radius:999px;background:rgba(251,191,36,.14);
    color:#fbbf24;font-weight:700;font-size:10px;letter-spacing:.04em}
  /* main */
  .main{margin-left:264px;flex:1;padding:26px 34px;max-width:1200px}
  h1{font-size:24px;font-weight:700;margin:0 0 3px}
  .sub{color:var(--mut);margin:0 0 18px;font-size:13.5px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px 20px;margin-bottom:18px}
  .card h2{font-size:15px;font-weight:700;margin:0 0 3px}
  .card .h-sub{color:var(--mut);font-size:12.5px;margin:0 0 14px}
  .row{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:18px}
  .tile{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:15px 17px;flex:1;min-width:160px}
  .tile .k{color:var(--mut);font-size:12px} .tile .v{font-size:26px;font-weight:700;margin-top:4px;color:var(--ink)}
  .tile .v.sm{font-size:20px}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line)}
  th{color:var(--mut);font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.04em}
  td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
  .tri td{font-variant-numeric:tabular-nums;text-align:right} .tri td:first-child{text-align:left;font-weight:600}
  .tri th{text-align:right} .tri th:first-child{text-align:left}
  .tri .obs{background:#eff6ff} .tri .fut{color:#cbd5e1}
  .frow td{font-weight:700;color:var(--blue7);background:#f8fafc}
  .prow td{color:#92400e;background:#fffbeb}
  .crumb{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:0 0 16px;font-size:11px;
    text-transform:uppercase;letter-spacing:.04em;color:#94a3b8}
  .crumb .sep{color:#cbd5e1}
  .crumb .done{color:#64748b} .crumb .on{color:var(--blue);font-weight:800}
  .anom{color:var(--red);font-weight:700;background:var(--redbg)}
  .pill{display:inline-block;padding:2px 9px;border-radius:999px;font-size:11px;font-weight:700}
  .pill-green{background:var(--greenbg);color:var(--green)} .pill-amber{background:var(--ambbg);color:var(--amber)}
  .pill-red{background:var(--redbg);color:var(--red)} .pill-blue{background:#dbeafe;color:var(--blue7)}
  .pill-slate{background:#e2e8f0;color:#334155} .pill-violet{background:var(--violetbg);color:var(--violet)}
  .btn{padding:8px 14px;border-radius:8px;background:var(--blue);color:#fff;border:0;cursor:pointer;
    font-size:12.5px;font-weight:700;transition:background .12s}
  .btn:hover{background:var(--blue7)} .btn:disabled{opacity:.5;cursor:default}
  .explain{background:linear-gradient(90deg,#eef2ff,#faf5ff);border:1px solid #ddd6fe;border-radius:10px;
    padding:11px 15px;margin:0 0 16px;font-size:12.5px;color:#4338ca;line-height:1.6}
  .explain b{color:#312e81}
  details.why{margin-top:10px} details.why summary{cursor:pointer;color:var(--blue);font-size:12.5px;font-weight:600}
  details.why div{color:var(--mut);margin-top:7px;font-size:12.5px}
  .about{background:var(--ambbg);border:1px solid #fde68a;border-radius:12px;padding:14px 18px;
    font-size:12.5px;color:#92400e;line-height:1.6;margin-top:24px}
  .mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px}
  .seam{display:flex;align-items:stretch;gap:0;margin:6px 0 2px;flex-wrap:wrap}
  .seam .z{flex:1;min-width:180px;border:1px solid var(--line);border-radius:10px;padding:12px 14px;background:#f8fafc}
  .seam .z.mid{border-color:var(--blue4);background:#eff6ff}
  .seam .arrow{align-self:center;color:var(--mut);padding:0 10px;font-size:18px}
  .z .zt{font-weight:700;font-size:12.5px;color:var(--ink)} .z .zd{color:var(--mut);font-size:11.5px;margin-top:4px}
  .brief{background:#f8fafc;border:1px solid var(--line);border-left:3px solid var(--violet);border-radius:8px;
    padding:14px 16px;font-size:13.5px;line-height:1.6;white-space:pre-wrap}
  .brief .tag{font-size:10.5px;color:var(--mut);text-transform:uppercase;letter-spacing:.05em;margin-bottom:8px;display:block}
  .load{color:var(--mut);font-size:13px;padding:8px 0}
  .err{background:var(--redbg);border:1px solid #fecaca;color:#991b1b;border-radius:10px;padding:12px 15px;font-size:12.5px}
  select{background:#fff;color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:7px 11px;font-size:13px}
  .lin{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:10px 0}
  .lin .node{background:#f8fafc;border:1px solid var(--line);border-radius:8px;padding:8px 12px;font-size:12px}
  .lin .node.on{border-color:var(--green);background:var(--greenbg)} .lin .a{color:var(--mut);font-size:16px}
  iframe{width:100%;height:680px;border:0;border-radius:10px}
  .step-table td:nth-child(2){white-space:normal}
  .doors{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}
  .door{border:1px solid var(--line);border-radius:10px;padding:14px 15px;cursor:pointer;background:#fff;transition:box-shadow .12s,transform .12s}
  .door:hover{box-shadow:0 4px 16px rgba(15,23,42,.08);transform:translateY(-1px)}
  .door .dn{font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--mut);font-weight:700}
  .door .dt{font-size:14.5px;font-weight:700;margin-top:3px}
  .door .dd{font-size:12px;color:var(--mut);margin-top:5px;line-height:1.5}
  .door .dgo{font-size:12px;font-weight:700;color:var(--blue);margin-top:9px}
  /* control tabs (ingestion) — one idea at a time on a big screen */
  .tabs{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin-bottom:18px}
  @media(max-width:1000px){.tabs{grid-template-columns:repeat(3,1fr)}}
  @media(max-width:620px){.tabs{grid-template-columns:repeat(2,1fr)}}
  .tab{display:flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--line);border-radius:10px;
    padding:10px 12px;cursor:pointer;transition:box-shadow .12s,border-color .12s,transform .12s}
  .tab:hover{box-shadow:0 3px 12px rgba(15,23,42,.07);transform:translateY(-1px)}
  .tab.on{border-color:var(--blue);box-shadow:0 0 0 1px var(--blue) inset;background:#f5f9ff}
  .tab .ti{font-size:15px;color:var(--mut);flex-shrink:0}
  .tab.on .ti{color:var(--blue)}
  .tab .tl{display:block;font-size:12px;font-weight:700;line-height:1.25}
  .tab.on .tl{color:var(--blue7)}
  .tab .tn{display:block;font-size:10.5px;color:var(--mut);margin-top:1px}
  /* Workbench AI cards */
  .supcard{background:linear-gradient(135deg,#f5f3ff,#fff);border:2px solid #ddd6fe;border-radius:14px;padding:20px;max-width:560px;margin:0 auto 18px;text-align:center}
  .supcard .eyebrow{font-size:10px;text-transform:uppercase;letter-spacing:.12em;color:var(--violet);font-weight:800}
  .supcard h3{font-size:20px;font-weight:800;color:#4c1d95;margin:4px 0 0}
  .supcard p{font-size:12.5px;color:#5b21b6;line-height:1.6;margin:8px 0 0}
  .supcard .ep{margin-top:12px;padding-top:10px;border-top:1px solid #ddd6fe;font-size:11px;color:var(--violet)}
  .agrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
  @media(max-width:900px){.agrid{grid-template-columns:repeat(2,1fr)}}
  @media(max-width:600px){.agrid{grid-template-columns:1fr}}
  .acard{border:1px solid var(--line);border-left-width:4px;border-radius:12px;padding:14px;background:#fff;cursor:pointer;display:flex;flex-direction:column;gap:8px;transition:box-shadow .12s,transform .12s}
  .acard:hover{box-shadow:0 4px 16px rgba(15,23,42,.10);transform:translateY(-1px)}
  .acard .ah{display:flex;align-items:flex-start;gap:8px}
  .acard .ai{font-size:18px;line-height:1;width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
  .acard .an{font-weight:700;font-size:14px;flex:1;line-height:1.25}
  .acard .abadge{font-size:8px;text-transform:uppercase;letter-spacing:.1em;font-weight:800;padding:2px 6px;border-radius:5px}
  .acard .as{font-size:12px;color:var(--mut);line-height:1.5;flex:1}
  .acard .af{font-size:10px;color:#8a94a3;border-top:1px solid var(--line);padding-top:8px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
  .acard .ago{font-size:11.5px;font-weight:700}
  /* per-tile colour tones */
  .t-violet{border-left-color:#6d28d9}.t-violet .ai{background:#ede9fe;color:#6d28d9}.t-violet .abadge{background:#ede9fe;color:#6d28d9}.t-violet .ago{color:#6d28d9}
  .t-blue{border-left-color:#2563eb}.t-blue .ai{background:#dbeafe;color:#1d4ed8}.t-blue .abadge{background:#dbeafe;color:#1d4ed8}.t-blue .ago{color:#1d4ed8}
  .t-emerald{border-left-color:#16a34a}.t-emerald .ai{background:#dcfce7;color:#15803d}.t-emerald .abadge{background:#dcfce7;color:#15803d}.t-emerald .ago{color:#15803d}
  .t-amber{border-left-color:#d97706}.t-amber .ai{background:#fef3c7;color:#b45309}.t-amber .abadge{background:#fef3c7;color:#b45309}.t-amber .ago{color:#b45309}
  .t-cyan{border-left-color:#0891b2}.t-cyan .ai{background:#cffafe;color:#0e7490}.t-cyan .abadge{background:#cffafe;color:#0e7490}.t-cyan .ago{color:#0e7490}
  .t-rose{border-left-color:#e11d48}.t-rose .ai{background:#ffe4e6;color:#be123c}.t-rose .abadge{background:#ffe4e6;color:#be123c}.t-rose .ago{color:#be123c}
</style>
</head>
<body>
<div class="app">
  <div class="sidebar">
    <div class="brand" onclick="go('overview')">
      <div class="logo">△</div>
      <div><div class="bt">Reserving Workbench</div><div class="bs" id="entity">Bricksurance SE</div></div>
    </div>
    <div class="nav" id="nav"></div>
    <div class="side-foot">
      <a onclick="go('learn')" id="learnTile" style="display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:8px;border:1px solid rgba(52,211,153,.25);background:rgba(52,211,153,.08);color:#a7f3d0;cursor:pointer;margin-bottom:10px;text-decoration:none">
        <span style="font-size:15px">🎓</span><span><span style="font-weight:700;font-size:12px;display:block;line-height:1.2">Learn</span><span style="font-size:10px;color:#6ee7b7">How reserving works</span></span>
      </a>
      <div style="display:flex;gap:6px;margin-bottom:8px">
        <button id="cacheBtn" onclick="toggleCache()" style="flex:1;font-size:10.5px;font-weight:700;padding:6px;border-radius:7px;border:1px solid rgba(52,211,153,.4);background:rgba(52,211,153,.12);color:#34d399;cursor:pointer">AI: cached</button>
        <button onclick="resetDemo()" style="flex:1;font-size:10.5px;font-weight:700;padding:6px;border-radius:7px;border:1px solid rgba(148,163,184,.3);background:rgba(148,163,184,.1);color:#cbd5e1;cursor:pointer">Reset demo</button>
      </div>
      <span id="resetmsg" style="font-size:10.5px;color:#7c8797"></span>
      Synthetic demo · governed on Databricks
      <br><span class="st">IN PROGRESS</span>
    </div>
  </div>
  <div class="main" id="main"><div class="load">Loading…</div></div>
</div>
<script>
const API=(p,o)=>fetch(p,o).then(async r=>{if(!r.ok){throw new Error('HTTP '+r.status+' on '+p);}return r.json();});
const fmt=(n)=> n==null||n===''?'—':Number(n).toLocaleString('en-GB',{maximumFractionDigits:0});
// negative money reads as -£1,234 not £-1,234
const money=(n)=> n==null||n===''?'—':(Number(n)<0?'-£'+fmt(Math.abs(Number(n))):'£'+fmt(n));
let CFG={};

// grouped navigation — a landing "Today", then the actuarial workflow in 4 sections.
// Dashboards merged: methods (methodology+estimates+ranges), diagnostics (validation+movement+large-loss),
// ai (workbench AI + Genie), governance (+assets). ~10 destinations in 4 groups.
const NAV=[
  {section:null, items:[["overview","Today","▤"]]},
  {section:"Prepare", items:[["ingestion","Ingestion & data controls","⇩"],["triangle","Triangle & selection","△"]]},
  {section:"Analyse", items:[["methods","Methods & estimates","∑"],["diagnostics","Diagnostics","◫"],["backtest","Method accuracy","◎"]]},
  {section:"Decide", items:[["judgements","Expert judgement","⚖"],["committee","Committee","◆"],["governance","Governance & sign-off","⬡"]]},
  {section:"AI & platform", items:[["ai","Workbench AI","✦"],["engines","Engines & your models","⚙"]]},
];
const PAGES=NAV.flatMap(g=>g.items);
let CURRENT="overview", LOB="COMMERCIAL_PROPERTY";

function renderNav(){
  const nav=document.getElementById('nav'); nav.innerHTML='';
  NAV.forEach(g=>{
    if(g.section){const s=document.createElement('div');s.className='nav-section';s.textContent=g.section;nav.appendChild(s);}
    g.items.forEach(([id,label,ic])=>{
      const a=document.createElement('a'); a.className=(id===CURRENT?'active':'');
      a.innerHTML=`<span class="ic">${ic}</span> ${label}`; a.onclick=()=>go(id); nav.appendChild(a);
    });
  });
}
function go(id){CURRENT=id;renderNav();route();}
let CACHE_ON=true;
async function toggleCache(){
  const r=await API('/api/ai/cache/toggle',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({on:!CACHE_ON})});
  CACHE_ON=r.use_cache; const b=document.getElementById('cacheBtn');
  b.textContent='AI: '+(CACHE_ON?'cached':'live');
  b.style.color=CACHE_ON?'#34d399':'#fbbf24'; b.style.borderColor=CACHE_ON?'rgba(52,211,153,.4)':'rgba(251,191,36,.45)';
  b.style.background=CACHE_ON?'rgba(52,211,153,.12)':'rgba(251,191,36,.12)';
}
async function resetDemo(){
  const m=document.getElementById('resetmsg'); m.textContent='Resetting…';
  try{const r=await API('/api/reset',{method:'POST'}); m.textContent='✓ reset ('+(r.actions||[]).length+' actions)'; setTimeout(()=>{m.textContent='';route();},1500);}
  catch(e){m.textContent='reset failed';}
}
// "You are here in the close" — the 5 stages of a reserving close, so a big-screen
// viewer never loses the thread across ~11 nav destinations. Each page maps to a stage.
const CLOSE_STAGES=[["Trust the data",["ingestion"]],["Select",["triangle"]],
  ["Analyse",["methods","diagnostics"]],["Decide",["judgements","committee"]],
  ["Sign off",["governance"]]];
function crumb(){
  const here=CLOSE_STAGES.findIndex(s=>s[1].includes(CURRENT));
  if(here<0) return '';   // Today / AI / engines / learn sit outside the linear close
  return `<div class="crumb">${CLOSE_STAGES.map((s,i)=>
    `<span class="${i===here?'on':(i<here?'done':'')}">${i+1} · ${s[0]}</span>`).join('<span class="sep">→</span>')}</div>`;
}
const main=(h)=>document.getElementById('main').innerHTML=crumb()+h;
const explain=(h)=>`<div class="explain"><b>What am I seeing?</b> ${h}</div>`;
const ABOUT=`<div class="about"><b>About this demo.</b> Bricksurance SE is fictional and all data is synthetic. This workbench demonstrates the <i>platform pattern</i> for governed reserving on Databricks — the methodology is illustrative, not a certified actuarial model. Every panel reads a real Unity Catalog table, view or function.</div>`;

async function route(){
  main('<div class="load">Loading…</div>');
  try{ await PAGE[CURRENT](); }
  catch(e){ main(`<h1>${(PAGES.find(p=>p[0]===CURRENT)||['','Page'])[1]}</h1><div class="err">Couldn't load this page: ${e.message}. The app may be waking up — try again in a moment.</div>`); }
}
const PAGE={};

PAGE.overview=async()=>{
  const [a,lc]=await Promise.all([API('/api/attention'),API('/api/lifecycle')]);
  const t=a.totals||{};
  const stbadge=(s)=> s==='built'?'<span class="pill pill-green">built</span>':'<span class="pill pill-amber">next</span>';
  const book=a.book||[]; const gate=a.data_gate||[];
  const blocked=gate.filter(g=>g.status_code==='BLOCKED').length;
  const attested=gate.filter(g=>g.status_code==='ACCEPTED').length;
  // one row per line of business, ranked by how much it needs an actuary — the
  // answer to "we run 30+ classes, does this scale?"
  const flagCell=(n,tone,title)=> Number(n)>0
    ? `<span class="pill pill-${tone}" title="${title}">${n}</span>`
    : '<span style="color:#cbd5e1">—</span>';
  main(`<h1>Today — Q4 close cockpit</h1>
  <p class="sub">Valuation ${a.valuation_date}. Where the book needs you this close.</p>
  ${explain(`The reserving actuary's Monday morning. The triangle is already built and reconciling to the ledger — no weekend in Excel, no <span class="mono">_v7_FINAL.xlsx</span>. The platform ranks the <b>whole book</b> by what needs a human: data that restated, cohorts that failed validation, mappings that moved, selections still open. You spend the quarter on judgement, not on assembling the numbers.`)}
  <div class="row">
    <div class="tile"><div class="k">Best-estimate ultimate</div><div class="v">${money(t.ultimate)}</div></div>
    <div class="tile"><div class="k">IBNR</div><div class="v">${money(t.ibnr)}</div></div>
    <div class="tile" style="${blocked?'border-color:#fecaca;background:#fffbfb':''}">
      <div class="k">Data accepted for this close</div>
      <div class="v sm" style="color:${blocked?'#dc2626':'#16a34a'}">${attested}/${gate.length} domains</div>
      <div style="color:var(--mut);font-size:11.5px;margin-top:4px">${blocked?`${blocked} blocked — a control is failing`:'all attested by the data owner'}</div></div>
    <div class="tile"><div class="k">Open decisions</div><div class="v sm">${Number(a.pending_selections)+Number(a.pending_signoffs)}</div>
      <div style="color:var(--mut);font-size:11.5px;margin-top:4px">${a.pending_selections} selection · ${a.pending_signoffs} sign-off</div></div>
  </div>
  <div class="card" style="border-color:#c7d2fe"><h2>The book — every line, ranked by what needs you</h2>
  <div class="h-sub">You didn't eyeball 40 triangles; the platform read them all and sorted them. Click a line to work it.</div>
    <table><thead><tr><th>Line of business</th><th class="num">Ultimate</th><th class="num">IBNR</th>
      <th class="num" title="Cohorts that failed actual-vs-expected validation">Validation</th>
      <th class="num" title="Claims whose movement restated an already-reported cell">Restated</th>
      <th class="num" title="Class mappings that changed since the prior close">Mapping</th>
      <th class="num" title="Large losses distorting a development factor">Large loss</th>
      <th>Sign-off</th><th></th></tr></thead><tbody>
    ${book.map(r=>{const br=Number(r.breaches||0);
      return `<tr${br?' style="background:#fffbfb"':''}>
      <td><b>${r.lob.replace(/_/g,' ')}</b>${br?' <span class="pill pill-red" style="font-size:9.5px">needs review</span>':''}</td>
      <td class="num">${money(r.ultimate)}</td><td class="num">${money(r.ibnr)}</td>
      <td class="num">${flagCell(br,'red','cohorts outside tolerance'+(r.worst_resid?` (worst residual ${Number(r.worst_resid).toFixed(1)})`:''))}</td>
      <td class="num">${flagCell(r.restating_claims,'amber','claims restating an already-reported cell')}</td>
      <td class="num">${flagCell(r.mapping_changes,'amber','class mappings changed since the prior close')}</td>
      <td class="num">${flagCell(r.large_losses,'blue','large losses distorting a factor')}</td>
      <td><span class="pill ${r.signoff_status==='APPROVED'?'pill-green':'pill-amber'}">${r.signoff_status==='APPROVED'?'signed':'pending'}</span></td>
      <td><button class="btn" style="padding:4px 10px;font-size:11.5px" onclick="LOB='${r.lob}';go('triangle')">Work it →</button></td></tr>`;}).join('')}
    </tbody></table>
    <details class="why"><summary>Where does each flag come from?</summary><div><b>Validation</b> — actual-vs-expected on the first development step, flagged beyond ±2.5 standardised residuals. <b>Restated</b> — claims whose movement since the prior close changed a triangle cell that was already reported (backdated transactions and reopens). <b>Mapping</b> — source-class mappings that moved between reserving classes since the prior close. <b>Large loss</b> — individual claims above threshold that distort a mechanical factor. Every flag is a query over a governed table, not a spreadsheet someone maintains — so this view works the same at 5 classes or 50.</div></details>
  </div>
  <div class="card"><h2>The close, end to end</h2><div class="h-sub">Four doors, one governed flow. Jump in anywhere.</div>
    <div class="doors">
      ${[["ingestion","1 · Trust the data","Ingestion & data controls","What changed, does it reconcile, has the owner signed it off.","#2563eb"],
         ["triangle","2 · Make the judgement","Triangle & selection","Review factors, override the anomaly, select — with an AI second pair of eyes.","#2563eb"],
         ["diagnostics","3 · Explain the movement","Diagnostics & roll-forward","Why did reserves move — a decomposition, not a weekend.","#6d28d9"],
         ["governance","4 · Sign off & reproduce","Governance & sign-off","Put your name to the number; reproduce it as-at, months later.","#16a34a"]
      ].map(d=>`<div class="door" onclick="go('${d[0]}')" style="border-top:3px solid ${d[4]}">
        <div class="dn">${d[1]}</div><div class="dt">${d[2]}</div><div class="dd">${d[3]}</div><div class="dgo">Open →</div></div>`).join('')}
    </div>
  </div>
  <div class="row">
    <div class="card" style="flex:1;min-width:280px"><h2>Sign-off status</h2><div class="h-sub">Where each line stands for this close.</div>
      <table><thead><tr><th>Line of business</th><th class="num">Best estimate</th><th>Status</th></tr></thead><tbody>
      ${(a.signoff||[]).map(s=>`<tr><td>${s.line_of_business_code.replace(/_/g,' ')}</td><td class="num">${money(s.signed_best_estimate)}</td><td><span class="pill ${s.status_code==='APPROVED'?'pill-green':'pill-amber'}">${s.status_code==='APPROVED'?'signed':'pending'}</span></td></tr>`).join('')}
      </tbody></table></div>
    <div class="card" style="flex:1;min-width:280px"><h2>Two teams, one triangle</h2><div class="h-sub">The same machinery, framed for each.</div>
      <div style="padding:10px 0;border-bottom:1px solid var(--line)"><b>Reserving actuary</b> — book the reserve: select factors, validate, judge, sign off.</div>
      <div style="padding:10px 0"><b>Pricing analyst</b> — develop losses to ultimate for the rate <b>indication</b>: same triangle, feeds the indicated rate, not the balance sheet.</div>
    </div>
  </div>
  <details class="why"><summary>The full lifecycle (${lc.built}/${lc.total} stages built)</summary>
  <table class="step-table" style="margin-top:8px"><thead><tr><th>Stage</th><th>What it answers</th><th>Status</th></tr></thead><tbody>
  ${lc.stages.map(s=>`<tr><td><b>${s.n} · ${s.stage}</b></td><td>${s.answers}</td><td>${stbadge(s.status)}</td></tr>`).join('')}
  </tbody></table></details>
  ${ABOUT}`);
};

// ---- Ingestion & data controls -------------------------------------------------
// The "trust the data" front door. Six controls in the order a real close asks
// them, each on its own tab so a big-screen audience sees one idea at a time
// instead of six stacked tables.
const MOVE_LABEL={NEW_CLAIM:'New claims notified',REOPENED:'Reopened claims',
  REVALUED_UP:'Case reserves strengthened',REVALUED_DOWN:'Case reserves released',
  BACKDATED_TRANSACTION:'Backdated transactions',CLOSED:'Claims closed'};
const DIM_TONE={ACCURACY:'blue',COMPLETENESS:'violet',APPROPRIATENESS:'amber'};
let ING={tab:'movement', data:null};

PAGE.ingestion=async()=>{
  ING.data=await API('/api/ingestion');
  const d=ING.data;
  const feeds=d.feeds||[], exp=d.expectations||[], rec=d.reconciliation||[];
  const gate=d.data_signoff||[];
  const critFails=exp.filter(e=>e.severity==='critical'&&!(e.passed===true||e.passed==='true')).length;
  const recBreaks=rec.filter(r=>!(r.ties===true||r.ties==='true')).length;
  const lateFeeds=feeds.filter(f=>f.sla_due_at&&f.arrived_at&&f.arrived_at>f.sla_due_at).length;
  const incomplete=feeds.filter(f=>Number(f.months_present||0)<Number(f.months_expected||0)).length;
  const mapChanges=(d.mapping||[]).filter(m=>m.changed_since_prior===true||m.changed_since_prior==='true').length;
  const blocked=gate.filter(g=>g.status_code==='BLOCKED').length;
  const accepted=gate.filter(g=>g.status_code==='ACCEPTED').length;
  const net=d.movement_net||{};
  const restatingClaims=(d.movement_restating||[]).reduce((a,r)=>a+Number(r.claim_count||0),0);

  const TABS=[
    ['movement','1 · What changed',`${fmt(net.claims)} movements`,'⇄'],
    ['recon','2 · Reconciliation',`${recBreaks?recBreaks+' break':'all tie'}`,'⚖'],
    ['gate','3 · Data sign-off',`${accepted}/${gate.length} attested`,'✓'],
    ['dq','4 · Quality checks',`${critFails?critFails+' critical':'all pass'}`,'◫'],
    ['feeds','5 · Feeds & timeliness',`${lateFeeds?lateFeeds+' late':'on time'}`,'⇩'],
    ['mapping','6 · Class mapping',`${mapChanges?mapChanges+' changed':'unchanged'}`,'⇉'],
  ];

  main(`<h1>Ingestion &amp; data controls</h1>
  <p class="sub">Before a single factor is selected: what changed, does it reconcile, and has the data owner signed it off.</p>
  ${explain(`The 90% of reserving nobody demos. Six controls, in the order a real close asks them — <b>what moved in my data since last quarter</b>, <b>does it reconcile to the ledger</b>, <b>has the data owner attested it</b>, <b>which quality checks passed</b> (tagged with the Solvency II data-quality dimension, because reserving feeds the technical provisions), <b>is every month present and on time</b>, and <b>did any class mapping change</b>. Each is a governed table, not a spreadsheet: the reconciliation is real arithmetic against the claim ledger, and the sign-off gate refuses to attest while a critical control is red.`)}
  <div class="row">
    <div class="tile" style="border-color:${blocked?'#fecaca':'#bbf7d0'};background:${blocked?'#fffbfb':'#f8fdf9'}">
      <div class="k">Data accepted for this close</div>
      <div class="v sm" style="color:${blocked?'#dc2626':'#16a34a'}">${accepted} of ${gate.length} domains</div>
      <div style="color:var(--mut);font-size:11.5px;margin-top:4px">${blocked?`${blocked} blocked by a failing control`:'all domains attested'}</div></div>
    <div class="tile"><div class="k">Claims that moved since Q3</div><div class="v sm">${fmt(net.claims)}</div>
      <div style="color:var(--mut);font-size:11.5px;margin-top:4px">net ${money(net.net)} across ${net.lobs} lines</div></div>
    <div class="tile" style="${restatingClaims?'border-color:#fed7aa;background:#fffbf5':''}">
      <div class="k">Restating already-reported cells</div>
      <div class="v sm" style="color:${restatingClaims?'#d97706':'#16a34a'}">${fmt(restatingClaims)}</div>
      <div style="color:var(--mut);font-size:11.5px;margin-top:4px">${restatingClaims?'last quarter’s numbers moved':'no restatement'}</div></div>
    <div class="tile"><div class="k">Controls failing</div>
      <div class="v sm" style="color:${(critFails+recBreaks)?'#dc2626':'#16a34a'}">${critFails+recBreaks}</div>
      <div style="color:var(--mut);font-size:11.5px;margin-top:4px">${critFails} critical check · ${recBreaks} reconciliation</div></div>
  </div>
  <div class="tabs" id="ingtabs">
    ${TABS.map(([id,label,note,ic])=>`<div class="tab ${id===ING.tab?'on':''}" onclick="ingTab('${id}')">
      <span class="ti">${ic}</span><span><span class="tl">${label}</span><span class="tn">${note}</span></span></div>`).join('')}
  </div>
  <div id="ingbody"></div>${ABOUT}`);
  ingRender();
};
function ingTab(t){ING.tab=t;
  document.querySelectorAll('#ingtabs .tab').forEach(el=>el.classList.remove('on'));
  const idx=['movement','recon','gate','dq','feeds','mapping'].indexOf(t);
  const els=document.querySelectorAll('#ingtabs .tab'); if(els[idx])els[idx].classList.add('on');
  ingRender();}

// each tab says, in one line, what it is and why it's here — so a viewer landing on
// tab 4 isn't relying on the page-level explainer that covers all six.
const ING_SUBHEAD={
  movement:"What moved since last quarter — the first question of every close, and the one a spreadsheet answers by hand, if at all.",
  recon:"Does each feed tie to its independent source of record? The reconciliation that eats days when it doesn't — here it's a control, not a manual chase.",
  gate:"Has the data owner attested this domain is fit to reserve on? A formal gate: it refuses while a critical control is red.",
  dq:"Quality checks grouped by the Solvency II data-quality dimension — because reserving feeds the technical provisions, so this is regulatory evidence, not just testing.",
  feeds:"Every feed's arrival vs SLA and completeness of history — and the quarantine that blocks acceptance until a feed passes.",
  mapping:"Did any source-class → reserving-class mapping change since last quarter? The silent triangle-breaker no factor diagnostic can explain.",
};
function ingRender(){
  const d=ING.data, body=document.getElementById('ingbody'); if(!body)return;
  const sub=ING_SUBHEAD[ING.tab]?`<div class="explain" style="margin-bottom:14px">${ING_SUBHEAD[ING.tab]}</div>`:'';
  body.innerHTML=sub+({movement:ingMovement,recon:ingRecon,gate:ingGate,dq:ingDq,feeds:ingFeeds,mapping:ingMapping}[ING.tab]||ingMovement)(d);
  if(ING.tab==='gate') wireGate();
  if(ING.tab==='feeds') wireFeeds();
}

// 1 · the data diff — the first question of every close
function ingMovement(d){
  const byType=d.movement_by_type||[], rest=d.movement_restating||[];
  const max=Math.max(...byType.map(r=>Math.abs(Number(r.amount||0))),1);
  return `<div class="card"><h2>What changed in my data since last quarter</h2>
  <div class="h-sub">Movement from the 30 Sep close to this one, by type — derived from the claim ledger, not a hand-built comparison.</div>
    <table><thead><tr><th>Movement</th><th class="num">Claims</th><th class="num">Incurred impact</th><th style="width:38%"></th></tr></thead><tbody>
    ${byType.map(r=>{const amt=Number(r.amount||0),pos=amt>=0,w=Math.abs(amt)/max*100;
      return `<tr><td><b>${MOVE_LABEL[r.movement_type_code]||r.movement_type_code.replace(/_/g,' ')}</b></td>
      <td class="num">${fmt(r.claims)}</td>
      <td class="num" style="color:${pos?'#dc2626':'#16a34a'}">${pos?'+':''}${money(amt)}</td>
      <td><div style="background:#f1f5f9;border-radius:4px;height:9px;position:relative"><div style="position:absolute;left:0;top:0;height:9px;border-radius:4px;width:${w}%;background:${pos?'#f87171':'#4ade80'}"></div></div></td></tr>`;}).join('')}
    </tbody></table>
    <div style="margin-top:12px;color:var(--mut);font-size:12.5px">Net movement <b style="color:var(--ink)">${money((d.movement_net||{}).net)}</b> — the number the chief actuary asks about before anyone opens a triangle.</div>
  </div>
  <div class="card" style="border-color:#fed7aa;background:#fffbf5"><h2>⚠ Movements that restate an already-reported cell</h2>
  <div class="h-sub">These changed a triangle cell that was reported — and signed off — last quarter. The restatement you need to be told about, not discover.</div>
    <table><thead><tr><th>Line of business</th><th class="num">AY</th><th>Movement</th><th class="num">Claims</th><th class="num">Impact</th></tr></thead><tbody>
    ${rest.map(r=>{const amt=Number(r.amount||0),hero=r.movement_type_code==='BACKDATED_TRANSACTION';
      return `<tr${hero?' style="background:#fff7ed;font-weight:600"':''}><td>${r.line_of_business_code.replace(/_/g,' ')}</td><td class="num">${r.accident_year}</td>
      <td><span class="pill ${hero?'pill-red':'pill-amber'}">${(MOVE_LABEL[r.movement_type_code]||r.movement_type_code).toLowerCase()}</span></td>
      <td class="num">${fmt(r.claim_count)}</td><td class="num" style="color:${amt>=0?'#dc2626':'#16a34a'}">${amt>=0?'+':''}${money(amt)}</td></tr>`;}).join('')||'<tr><td colspan="5" class="load">Nothing restated — a clean quarter.</td></tr>'}
    </tbody></table>
    <details class="why"><summary>Why this is the beat that matters</summary><div>The top row is the AY2023 Commercial Property loss: <b>£1.05m posted this quarter but dated into 2023</b> — a cohort that was closed, reported and signed off. It is the single cause of the 3.63× development factor you'll see on the triangle, and this screen finds it in seconds, from the data, before any actuarial judgement is made. In a spreadsheet close, this is discovered in week three, if at all.</div></details>
  </div>`;
}

// 2 · reconciliation at ingestion — "I never fight the GL again"
function ingRecon(d){
  const rec=d.reconciliation||[];
  return `<div class="card"><h2>Reconciliation to the source of record</h2>
  <div class="h-sub">Every feed tied to an independent system before any reserving work — the days most closes lose.</div>
    <table><thead><tr><th>Control</th><th>Reconciled against</th><th class="num">Feed</th><th class="num">Source</th><th class="num">Difference</th><th>Result</th></tr></thead><tbody>
    ${rec.map(r=>{const ties=(r.ties===true||r.ties==='true');
      return `<tr${ties?'':' style="background:var(--redbg)"'}><td><b>${r.control_name}</b></td>
      <td style="color:var(--mut);font-size:12px">${r.source_of_truth}</td>
      <td class="num">${money(r.feed_amount)}</td><td class="num">${money(r.source_amount)}</td>
      <td class="num" style="color:${ties?'#16a34a':'#dc2626'};font-weight:${ties?'400':'700'}">${money(r.difference)}</td>
      <td><span class="pill ${ties?'pill-green':'pill-red'}">${ties?'ties':'BREAK'}</span></td></tr>`;}).join('')}
    </tbody></table>
    ${rec.filter(r=>r.explanation).map(r=>`<div style="margin-top:12px;background:var(--ambbg);border:1px solid #fde68a;border-radius:8px;padding:11px 14px;font-size:12.5px;color:#92400e"><b>${r.control_name}</b> — ${r.explanation}</div>`).join('')}
    <details class="why"><summary>What am I actually looking at?</summary><div>The claims controls are <b>real arithmetic</b>: the feed total is summed from the claim ledger this workbench derives its triangle from, so "ties to the penny" is a computation you could re-run, not a label. The one break is explained and owned — <i>an explained break is a control; an unexplained one is a risk</i>. And because the triangle is a view over the same ledger, the reconciliation holds all the way through to sign-off. There is no <span class="mono">_v7_FINAL.xlsx</span> in this picture.</div></details>
  </div>`;
}

// 3 · the data sign-off gate — the control that separates data from judgement
function ingGate(d){
  const gate=d.data_signoff||[];
  const pill=(s)=>s==='ACCEPTED'?'pill-green':(s==='BLOCKED'?'pill-red':'pill-amber');
  return `<div class="card"><h2>Data sign-off gate — is this data fit to reserve on?</h2>
  <div class="h-sub">The data owner attests per domain. Actuarial work starts on attested data, not on whatever landed.</div>
    <table><thead><tr><th>Data domain</th><th>Owner</th><th class="num">Feeds</th><th class="num">Controls</th><th>State</th><th>Attested by</th><th></th></tr></thead><tbody>
    ${gate.map(g=>{const st=g.status_code,ok=st==='ACCEPTED',bl=st==='BLOCKED';
      const cp=Number(g.controls_passing||0),ct=Number(g.controls_total||0);
      return `<tr${bl?' style="background:var(--redbg)"':''}><td><b>${g.data_domain}</b></td>
      <td style="color:var(--mut);font-size:12px">${g.owner_role}</td><td class="num">${g.feeds_covered}</td>
      <td class="num" style="color:${cp===ct?'#16a34a':'#dc2626'}">${cp}/${ct}</td>
      <td><span class="pill ${pill(st)}">${st.toLowerCase()}</span></td>
      <td style="font-size:12px">${g.attested_by||'—'}</td>
      <td>${ok?'':`<button class="btn gatebtn" data-domain="${g.data_domain}" style="padding:5px 11px;${bl?'background:#94a3b8':''}">Attest data</button>`}</td></tr>`;}).join('')}
    </tbody></table><div id="gatemsg" style="font-size:12.5px;color:var(--mut);margin-top:8px"></div>
    <div style="margin-top:14px">
    ${gate.filter(g=>g.note).map(g=>`<div style="border-left:3px solid ${g.status_code==='BLOCKED'?'#dc2626':(g.status_code==='ACCEPTED'?'#16a34a':'#d97706')};background:#f8fafc;border-radius:0 8px 8px 0;padding:10px 14px;margin-bottom:8px;font-size:12.5px"><b>${g.data_domain}</b> <span style="color:var(--mut)">— ${g.note}</span></div>`).join('')}
    </div>
    <details class="why"><summary>Try it: the gate is a real gate</summary><div>Click <b>Attest data</b> on <b>Large losses &amp; bordereaux</b> — it is <b>refused</b>, and it names the failing control. The state isn't a flag someone set; it's computed from the reconciliation and quality checks, so nobody can attest data while a critical control is red. Attest <b>Premium &amp; exposure</b> instead and it succeeds, records who attested it, and writes to the audit trail. This is the upstream twin of the reserve sign-off at the far end of the process — two different jobs, usually conflated: the data owner says <i>the data is right</i>, the actuary then says <i>the judgement is mine</i>.</div></details>
  </div>`;
}
function wireGate(){
  document.querySelectorAll('.gatebtn').forEach(b=>b.onclick=()=>attestData(b.dataset.domain));
}
async function attestData(domain){
  const m=document.getElementById('gatemsg'); m.textContent='Attesting '+domain+'…';
  try{const r=await API('/api/ingestion/attest',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({data_domain:domain})});
    if(r.ok){m.innerHTML=`<span style="color:#16a34a">✓ ${domain} attested by ${r.by} — recorded in the audit trail. Refreshing…</span>`;
      setTimeout(()=>PAGE.ingestion(),900);}
    else m.innerHTML=`<span style="color:#dc2626">⛔ Refused — ${r.error}</span>`;}
  catch(e){m.innerHTML=`<span style="color:#dc2626">Attestation failed: ${e.message}</span>`;}
}

// 4 · DQ checks, grouped by the Solvency II data-quality dimension
function ingDq(d){
  const exp=d.expectations||[];
  const dims=['ACCURACY','COMPLETENESS','APPROPRIATENESS'];
  const group={}; exp.forEach(e=>{(group[e.dq_dimension_code||'OTHER']=group[e.dq_dimension_code||'OTHER']||[]).push(e);});
  const card=(dim)=>{const rows=group[dim]||[]; if(!rows.length)return '';
    const fails=rows.filter(e=>!(e.passed===true||e.passed==='true')).length;
    return `<div class="card"><h2><span class="pill pill-${DIM_TONE[dim]||'slate'}" style="font-size:11px;vertical-align:middle">${dim.toLowerCase()}</span>
      &nbsp;${rows.length-fails} of ${rows.length} passing</h2>
    <div class="h-sub">${{ACCURACY:'Free from material error and reconciling to source.',COMPLETENESS:'Every period, cohort and claim present — nothing silently missing.',APPROPRIATENESS:'Relevant to the estimate and consistently defined over time.'}[dim]||''}</div>
      <table><thead><tr><th>Check</th><th>Feed</th><th>Severity</th><th class="num">Failed</th><th>Result</th><th>Detail</th></tr></thead><tbody>
      ${rows.map(e=>{const ok=(e.passed===true||e.passed==='true');
        return `<tr${ok?'':' style="background:var(--redbg)"'}><td>${e.expectation_name}</td>
        <td class="mono" style="font-size:11px">${e.feed_id.replace('FEED-','')}</td>
        <td><span class="pill ${e.severity==='critical'?'pill-red':'pill-slate'}">${e.severity}</span></td>
        <td class="num">${e.failed_rows}</td><td><span class="pill ${ok?'pill-green':'pill-red'}">${ok?'pass':'FAIL'}</span></td>
        <td style="color:var(--mut);font-size:12px">${e.detail||''}</td></tr>`;}).join('')}
      </tbody></table></div>`;};
  return `<div class="explain" style="background:linear-gradient(90deg,#eff6ff,#f5f3ff)"><b>Why these three groups?</b> Solvency II requires the data behind the technical provisions to be <b>accurate, complete and appropriate</b>, evidenced per source. Reserving feeds the technical provisions directly — so tagging every check with its dimension turns an engineering test suite into the data-quality evidence your regulator already asks for.</div>
  ${dims.map(card).join('')}`;
}

// 5 · feeds: completeness & timeliness
function ingFeeds(d){
  const feeds=d.feeds||[];
  const statusPill=(s)=>({accepted:'pill-green',arrived:'pill-blue',late:'pill-amber',quarantined:'pill-red'}[s]||'pill-slate');
  return `<div class="card"><h2>Source feeds — arrival, completeness, quality</h2>
  <div class="h-sub">Federated to Discovery for premium; One Shield for claims. Late against SLA and missing months are measured facts with an owner, not recurring complaints.</div>
    <table><thead><tr><th>Feed</th><th>Domain</th><th class="num">Rows</th><th class="num">Months</th><th>Arrival vs SLA</th><th class="num">DQ pass</th><th>Status</th><th></th></tr></thead><tbody>
    ${feeds.map(f=>{const dq=Number(f.dq_pass_pct);
      const late=f.sla_due_at&&f.arrived_at&&f.arrived_at>f.sla_due_at;
      const mp=Number(f.months_present||0),me=Number(f.months_expected||0),gap=me&&mp<me;
      return `<tr><td><b>${f.feed_name}</b><div class="mono" style="font-size:10.5px;color:var(--mut)">${f.source_system_code}</div></td>
      <td style="font-size:12px;color:var(--mut)">${f.data_domain||'—'}</td>
      <td class="num">${fmt(f.rows_received)}${f.rows_expected?`<span style="color:var(--mut)"> / ${fmt(f.rows_expected)}</span>`:''}</td>
      <td class="num" style="color:${gap?'#d97706':'#16a34a'}">${mp}/${me}${gap?' ⚠':''}</td>
      <td>${late?'<span class="pill pill-amber">late</span>':'<span class="pill pill-green">on time</span>'}</td>
      <td class="num" style="color:${dq>=99?'#16a34a':(dq>=95?'#d97706':'#dc2626')}">${dq.toFixed(1)}%</td>
      <td><span class="pill ${statusPill(f.status)}">${f.status}</span></td>
      <td>${f.status==='accepted'?'':`<button class="btn feedbtn" data-feed="${f.feed_id}" style="padding:5px 11px">Accept</button>`}</td></tr>`;}).join('')}
    </tbody></table><div id="ingmsg" style="font-size:12.5px;color:var(--mut);margin-top:8px"></div>
    <details class="why"><summary>Try it: acceptance is blocked, not warned</summary><div>The large-loss bordereau is <b>quarantined</b> — its reconciliation to the claims ledger is broken. Click <b>Accept</b> and the platform refuses: you cannot reserve on data that hasn't passed its checks. Note what is <i>not</i> quarantined: the raw £1.05m loss is already in the ledger (that's why AY2023 develops high) — what's held here is the <b>correcting bordereau entry</b>, waiting to tie.</div></details>
  </div>`;
}
function wireFeeds(){

}
async function acceptFeed(id){const m=document.getElementById('ingmsg');m.textContent='Accepting '+id+'…';
  try{const r=await API('/api/ingestion/accept',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({feed_id:id})});

// 6 · mapping control — the silent triangle-breaker

  const rows=d.mapping||[];

  return `${changed.length?`<div class="card" style="border-color:#fecaca;background:#fffbfb"><h2>⚠ ${changed.length} class mapping changed since the prior close</h2>
  <div class="h-sub">Nothing looks wrong, every control ties — but a cohort's history has moved between reserving classes.</div>
    ${changed.map(m=>`<div style="padding:10px 0;border-bottom:1px solid var(--line)">

      <div style="margin-top:6px;font-size:12.5px">
        <span class="pill pill-slate">${(m.prior_line_of_business_code||'').replace(/_/g,' ')}</span>

    </div>`).join('')}
    <details class="why"><summary>Why this is the one nobody sees coming</summary><div>A changed mapping is the classic triangle-breaker: the data is accurate, complete and reconciled, and <b>both</b> affected patterns still break — because history moved between classes. No factor diagnostic will ever explain it, so teams spend a week on archaeology. Holding the mapping as governed, versioned data with last quarter's value alongside turns that week into this row.</div></details>
  </div>`:''}
  <div class="card"><h2>Source class → reserving class</h2>

    <table><thead><tr><th>Source class</th><th>Description</th><th>Reserving class</th><th>Prior close</th><th class="num">Claims</th><th></th></tr></thead><tbody>
    ${rows.map(m=>{const ch=(m.changed_since_prior===true||m.changed_since_prior==='true');

}

function renderAudit(sels){
  if(!sels||!sels.length) return '<div class="load">No selections recorded for this line yet.</div>';
  return `<table><thead><tr><th>Selection</th><th>Source</th><th>Status</th><th>Rationale</th><th>By</th></tr></thead><tbody>
  ${sels.map(x=>`<tr><td class="mono">${x.selection_id}</td><td><span class="pill ${x.source_code==='RESQ'?'pill-violet':(x.source_code==='MANUAL'?'pill-amber':'pill-slate')}">${x.source_code}</span></td><td><span class="pill ${x.status_code==='APPROVED'?'pill-green':(x.status_code==='RETIRED'?'pill-slate':'pill-blue')}">${x.status_code}</span></td><td style="color:var(--mut)">${x.rationale||'—'}</td><td>${x.approved_by||x.selected_by}</td></tr>`).join('')}
  </tbody></table>`;
}

async function recompute(refillInputs){
  try{
    const r=await API('/api/selection/compute',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({lob:LOB,basis:SEL.basis,last_n:SEL.last_n,tail:SEL.tail,overrides:SEL.overrides})});
    SEL.empirical=r.empirical_factors; SEL.applied=r.applied_factors;
    SEL.prior=(r.prior_reserve&&r.prior_reserve.factors)||null;
    // empirical + prior rows — target by cell id so row order can't break them
    const cells=(get)=>SEL.lags.map(l=>{const f=get(l);const anom=(SEL.prior&&SEL.prior[l]!=null&&f!=null&&f>SEL.prior[l]*1.4);
      return `<td${anom?' class="anom"':''}>${f!=null?Number(f).toFixed(3):'—'}</td>`;}).join('');
    const emprow=document.getElementById('emprow');
    if(emprow&&emprow.parentElement) emprow.parentElement.innerHTML=`<td>empirical</td>${cells(l=>r.empirical_factors[l])}`;
    const priorrow=document.getElementById('priorrow');
    if(priorrow&&priorrow.parentElement) priorrow.parentElement.innerHTML=`<td>prior</td>${SEL.prior?cells(l=>SEL.prior[l]):`<td colspan="${SEL.lags.length}" style="text-align:left;color:var(--mut)">no prior pattern on record</td>`}`;
    paintWhyFactor(r.empirical_factors);
    // selected inputs — refill only when basis changed (preserve manual edits otherwise)
    if(refillInputs){
      document.querySelectorAll('.fin').forEach(inp=>{const l=inp.dataset.lag;
        inp.value=(SEL.overrides[l]!=null?SEL.overrides[l]:r.applied_factors[l]);
        inp.oninput=()=>{const v=parseFloat(inp.value);
          if(isNaN(v)){delete SEL.overrides[inp.dataset.lag];}else{SEL.overrides[inp.dataset.lag]=v;}
          SEL.overrode=Object.keys(SEL.overrides).length>0;markOverride();recomputeReserveOnly();};
      });
    }
    SEL.overrode=Object.keys(SEL.overrides).length>0;
    markOverride();
    paintReserve(r.reserve, r.prior_reserve);
  }catch(e){
    const m=document.getElementById('electmsg'); if(m) m.innerHTML=`<span style="color:#dc2626">Recompute failed: ${e.message}</span>`;
  }
}

async function recomputeReserveOnly(){
  try{
    const r=await API('/api/selection/compute',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({lob:LOB,basis:SEL.basis,last_n:SEL.last_n,tail:SEL.tail,overrides:SEL.overrides})});
    paintReserve(r.reserve, r.prior_reserve);
  }catch(e){}
}

function markOverride(){
  document.getElementById('ratreq').style.display=SEL.overrode?'inline':'none';
  document.querySelectorAll('.fin').forEach(inp=>{const l=inp.dataset.lag;
    inp.style.borderColor=(SEL.overrides[l]!=null)?'#d97706':'#c7d2fe';
    inp.style.background=(SEL.overrides[l]!=null)?'#fffbeb':'#fff';});
}

// per-datapoint "why" — the dev-language rule's second half. Names the factor that's off pattern.
function paintWhyFactor(emp){
  const el=document.getElementById('whyfactor'); if(!el)return;
  if(!SEL.prior){el.textContent='';return;}
  const off=SEL.lags.filter(l=>emp[l]!=null&&SEL.prior[l]!=null&&emp[l]>SEL.prior[l]*1.4)
    .map(l=>`${l*12}→${(l+1)*12}m (empirical ${Number(emp[l]).toFixed(2)}× vs prior ${Number(SEL.prior[l]).toFixed(2)}×)`);
  el.innerHTML = off.length
    ? `<b>Why the red cell:</b> the ${off.join(', ')} factor is well above the pattern you held last quarter — a single late large loss, not a trend. That's the one to decide on; hold the prior or take the spike.`
    : `Empirical factors sit close to the prior pattern this quarter — no single step is off. The averaging basis is the judgement here, not one anomalous factor.`;
}

async function doFitTail(method){
  const out=document.getElementById('tailout');
  out.innerHTML='<div class="load">Fitting the tail curve…</div>';
  try{
    const r=await API('/api/tail/fit',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({lob:LOB,method,basis:SEL.basis,last_n:SEL.last_n,overrides:SEL.overrides})});
    if(!r.tail||r.tail<=1){out.innerHTML=`<div style="font-size:12px;color:var(--mut)">${r.note||'No decaying tail to fit for this pattern.'}</div>`;return;}
    // apply the fitted tail into the tail input and recompute the reserve
    document.getElementById('tail').value=r.tail; SEL.tail=r.tail; recomputeReserveOnly();
    const fitted=(r.fitted_factors||[]).map(f=>Number(f).toFixed(4)).join(' · ');
    out.innerHTML=`<div style="background:#f0fdf4;border:1px solid #bbf7d0;border-radius:8px;padding:10px 13px;font-size:12.5px;color:#14532d">
      <b>${method==='INVERSE_POWER'?'Inverse-power':'Exponential'} tail fitted:</b> factor <b>${r.tail}</b>${r.r2!=null?` (fit R²&nbsp;${r.r2})`:''} — applied.
      <div style="color:#166534;margin-top:4px">Extrapolated factors beyond the triangle: ${fitted||'—'}</div>
      <div style="color:var(--mut);margin-top:4px">This is the curve, not a guessed number — override the tail box if your judgement differs.</div></div>`;
  }catch(e){out.innerHTML=`<div class="err">Tail fit failed: ${e.message}</div>`;}
}

async function holdPrior(){
  if(!SEL.prior){document.getElementById('electmsg').textContent='No prior pattern on record for this line.';return;}
  // copy prior into selected, mark every changed cell as an override
  SEL.overrides={};
  SEL.lags.forEach(l=>{if(SEL.prior[l]!=null) SEL.overrides[l]=Number(SEL.prior[l]);});
  document.querySelectorAll('.fin').forEach(inp=>{const l=inp.dataset.lag;
    if(SEL.prior[l]!=null) inp.value=Number(SEL.prior[l]);});
  SEL.overrode=true; markOverride(); recomputeReserveOnly();
  // pre-fill a rationale rather than bypass it — the audit trail is the point
  const rat=document.getElementById('rationale');
  if(rat && !rat.value.trim())
    rat.value="Held the prior approved pattern: this quarter's empirical spike is a single late-reported large loss reserved individually, not a change in development. Prior pattern remains the better estimate of underlying development.";
  document.getElementById('electmsg').innerHTML='<span style="color:#b45309">Prior pattern copied into your selection — edit the rationale and Select &amp; save, or adjust any factor first.</span>';
}

function paintReserve(res, prior){
  document.getElementById('r_ult').textContent=money(res.ultimate);
  document.getElementById('r_ibnr').textContent=money(res.ibnr);
  // gross-to-net: show the net ultimate + the programme, or make clear there's none

let PENDING_SEL=null, POLL=null;
function pipeChip(state, text, url){
  const tone={PENDING:['#fef3c7','#b45309'],RUNNING:['#dbeafe','#1d4ed8'],
              SUCCESS:['#dcfce7','#15803d'],FAILED:['#fee2e2','#b91c1c']}[state]||['#e2e8f0','#334155'];
  const link=url?` <a href="${url}" target="_blank" style="color:inherit;text-decoration:underline">open run →</a>`:'';
  document.getElementById('pipechip').innerHTML=
    `<span style="display:inline-block;padding:4px 10px;border-radius:999px;font-size:11.5px;font-weight:700;background:${tone[0]};color:${tone[1]}">${text}${link}</span>`;
}
async function approveAndRun(ev){
  const btn=ev.target; btn.disabled=true;
  pipeChip('PENDING','Approving…');
  try{
    const r=await API('/api/selection/approve',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({lob:LOB, selection_id:PENDING_SEL})});
    if(!r.ok){pipeChip('FAILED',r.error||'approve failed'); btn.disabled=false; return;}
    const s=await API('/api/selection?lob='+encodeURIComponent(LOB));
    document.getElementById('audit').innerHTML=renderAudit(s.selections||[]);
    if(!r.run||!r.run.ok){pipeChip('FAILED',(r.run&&r.run.error)||'pipeline not available'); btn.disabled=false; return;}
    pipeChip('RUNNING','Stage 3 running…', r.run.run_url);
    pollPipeline(r.run.run_id);
  }catch(e){pipeChip('FAILED',e.message); btn.disabled=false;}
}
function pollPipeline(runId){
  clearInterval(POLL);
  POLL=setInterval(async()=>{
    try{
      const st=await API('/api/pipeline/status?run_id='+runId);
      if(!st.ok) return;
      if(st.state==='RUNNING'||st.state==='PENDING'){pipeChip(st.state,'Stage 3 '+st.state.toLowerCase()+'…',st.run_url); return;}
      clearInterval(POLL);
      if(st.state==='SUCCESS'){
        pipeChip('SUCCESS','Stage 3 complete — loss cost updated', st.run_url);
      }else{
        // a FAILED stage 3 is usually the guard, and its message is the point
        pipeChip('FAILED','Stage 3 '+st.state.toLowerCase(), st.run_url);
        if(st.detail) document.getElementById('pipechip').insertAdjacentHTML('afterend',
          `<div style="margin-top:8px;font-size:12px;color:#b91c1c;background:#fef2f2;border:1px solid #fecaca;border-radius:8px;padding:9px 12px">${st.detail.replace(/</g,'&lt;')}</div>`);
      }
    }catch(e){clearInterval(POLL);}
  }, 4000);
}

PAGE.backtest=async()=>{

  <p class="sub">How each method WOULD have performed at past valuations (${vals}), scored against what actually emerged.</p>
  ${explain(`This is the thing a spreadsheet team can never keep and most reserving packages don't offer: <b>automated, tracked method accuracy</b>. We replay every method over the claim ledger truncated to each past valuation, and score its projection against the cohorts that have since run off. "Which method has been most accurate on this line?" becomes a number, not a memory — and the honest answer differs by line. No separate history is stored; the depth comes from replaying the one ledger.`)}
  <div class="card"><h2>Across the book — mean absolute error by method</h2><div class="h-sub">Lower is more accurate. Bias shows whether a method tends to over- or under-project.</div>
    <table><thead><tr><th>Method</th><th class="num">Mean abs error</th><th class="num">Bias</th><th class="num">Cohorts tested</th></tr></thead><tbody>
    ${bm.map((r,i)=>`<tr${i===0?' style="background:#f0fdf4;font-weight:600"':''}><td>${methodName(r.reserving_method_code)}${i===0?' <span class="pill pill-green" style="font-size:9.5px">most accurate</span>':''}</td>
      <td class="num">${r.mae_pct}%</td>
      <td class="num" style="color:${Number(r.bias_pct)>=0?'#dc2626':'#16a34a'}">${Number(r.bias_pct)>=0?'+':''}${r.bias_pct}%</td>
      <td class="num">${r.n}</td></tr>`).join('')}
    </tbody></table></div>
  <div class="card"><h2>By line of business — accuracy tracks tail length</h2><div class="h-sub">Short-tail lines are far more predictable than long-tail — measured, not asserted.</div>
    ${Object.entries(byLob).map(([lob,rows])=>`<div style="margin-bottom:14px">
      <div style="font-weight:700;font-size:13px;margin-bottom:4px">${lob.replace(/_/g,' ')} <span style="color:var(--mut);font-weight:400;font-size:11.5px">— best: ${methodName(rows[0].reserving_method_code)} at ${rows[0].mae_pct}%</span></div>
      <div style="display:flex;gap:6px;flex-wrap:wrap">${rows.map(r=>`<span class="pill ${r.reserving_method_code===rows[0].reserving_method_code?'pill-green':'pill-slate'}" style="font-size:11px">${methodName(r.reserving_method_code)}: ${r.mae_pct}%</span>`).join('')}</div>
    </div>`).join('')}
    <details class="why"><summary>How to use this in a real close</summary><div>When two methods disagree on a cohort, the back-test says which has been closer <b>on that line, historically</b> — a governed reason to lean one way, logged rather than remembered. Over time it's your champion/challenger record: if a challenger method starts beating the incumbent on a line, you'll see it here before it costs you. The scoring uses cohorts mature enough that their paid is essentially final, so no method is graded against another method's guess.</div></details>
  </div>${ABOUT}`);
};

async function raiseJudgement(ev){
  const btn=ev.target, msg=document.getElementById('ejmsg');

    magnitude:document.getElementById('ejmag').value, rationale:document.getElementById('ejrat').value, submit:true};
  btn.disabled=true; msg.textContent='Raising…';
  try{const r=await API('/api/judgements/raise',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});

}
async function approveJudgement(id){

}

const METHOD_NAME={CHAIN_LADDER:'Chain-ladder',BORNHUETTER_FERGUSON:'Bornhuetter-Ferguson',EXPECTED_LOSS_RATIO:'Expected loss ratio',MACK:'Mack',GLM:'GLM',PEER_COMPARISON:'Benchmark (peer pattern)',CAPE_COD:'Cape Cod',BENKTANDER:'Benktander-Hovinen',INHOUSE_FREQUENCY_SEVERITY:'In-house frequency-severity'};
const methodName=(c)=>METHOD_NAME[c]||(c||'').replace(/_/g,' ');
const SPEC_META={
  senior_reserving:{icon:'◆',where:'triangle · estimates · judgements',tone:'violet'},
  movement:{icon:'⇅',where:'reserve_rollforward',tone:'blue'},
  data_quality:{icon:'◫',where:'actual_vs_expected',tone:'amber'},
  committee_note:{icon:'✎',where:'judgements · estimates',tone:'emerald'},
  reviewer:{icon:'🔍',where:'selected_development_pattern',tone:'rose'},
  backtest:{icon:'◎',where:'method_backtest',tone:'cyan'},
};
PAGE.ai=async()=>{
  // draw from the STATIC catalogue — never block the page on a model call, or the
  // tiles take ~15s to appear while a scale-to-zero endpoint wakes up
  const [cat,st]=await Promise.all([
    API('/api/ai/specialists'),
    API('/api/ai/status').catch(()=>({})),
  ]);
  const specs=cat.specialists||[];
  const ep=st.agent_endpoint; const live=st.endpoint_live;
  main(`<h1>Workbench AI</h1><p class="sub">One supervisor, ${specs.length} specialists, one Genie — every call grounded on live tables and audited.</p>
  ${explain(`Type a question and the <b>supervisor</b> classifies it and dispatches to the right specialist; or open a specialist directly from its tile. Answers are grounded on the live reserving tables and every call is written to the governance audit trail. The AI drafts and reviews — you decide.`)}
  <div class="supcard">
    <div class="eyebrow">Workbench AI · Supervisor</div>
    <h3>Ask the reserving AI</h3>
    <p>A single Foundation-Model call classifies your question against the specialist catalogue, dispatches to the right one, and writes the routing decision to the audit log.</p>
    <div style="display:flex;gap:8px;margin-top:14px">
      <input id="q" placeholder="e.g. Why did Commercial Property reserves move this close?" style="flex:1;padding:9px 12px;border:1px solid #ddd6fe;border-radius:8px;font-size:13px">
      <button class="btn" id="askbtn" style="background:var(--violet)">Ask</button>
    </div>
    <div class="ep">${live?`Serving endpoint: <span class="mono">${ep}</span> · live`:'Serving endpoint provisioning — answers fall back to Foundation Model API / cache (shown per answer)'}</div>
  </div>
  <div id="aiout" style="margin-bottom:18px"></div>
  <div class="card"><h2>The specialists</h2><div class="h-sub">Each a governed agent grounded on specific tables. Click a tile to run it — Genie handles free-form questions across all of them.</div>
    <div class="agrid" id="agrid"></div>
    <div style="margin-top:12px;font-size:12px;color:var(--mut)">Live routing activity → <a onclick="go('governance')" style="cursor:pointer">Governance &amp; sign-off → AI activity</a></div>
  </div>
  <div id="gout" style="margin-top:2px"></div>${ABOUT}`);
  // 6 tiles = 5 specialists + Genie (3×2 grid), each coloured; Genie opens an inline ask box.
  const tiles=specs.map(s=>{const m=SPEC_META[s.key]||{icon:'✦',where:'live tables',tone:'blue'};
    return `<div class="acard t-${m.tone}" onclick="askSpecialist('${s.key}')">
      <div class="ah"><span class="ai">${m.icon}</span><span class="an">${s.name}</span><span class="abadge">agent</span></div>
      <div class="as">${s.scope}</div>
      <div class="af">reads: ${m.where}</div>
      <div class="ago">Ask this specialist →</div></div>`;});
  tiles.push(`<div class="acard t-cyan" onclick="openGenie()">
      <div class="ah"><span class="ai">✦</span><span class="an">Ask the Triangle — Genie</span><span class="abadge">genie</span></div>
      <div class="as">Free-form natural-language questions across all the reserving tables — governed SQL via the Genie Conversation API (server-side, no embed).</div>
      <div class="af">reads: all reserving tables</div>
      <div class="ago">Ask Genie →</div></div>`);
  document.getElementById('agrid').innerHTML=tiles.join('');
  document.getElementById('askbtn').onclick=()=>askAI(document.getElementById('q').value);
  document.getElementById('q').addEventListener('keydown',e=>{if(e.key==='Enter')askAI(e.target.value);});
};
function openGenie(){
  const out=document.getElementById('gout');
  out.innerHTML=`<div class="card" style="border-color:#a5f3fc"><h2>Ask the Triangle — Genie</h2><div class="h-sub">Natural-language over the reserving tables via the Genie Conversation API (server-side — governed SQL).</div>
    <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px">
      <input id="gq" placeholder="e.g. Total IBNR by line of business / cohorts that breached validation" style="flex:1;min-width:300px;padding:9px 12px;border:1px solid var(--line);border-radius:8px;font-size:13px">
      <button class="btn" id="gaskbtn" style="background:#0891b2">Ask Genie</button>
    </div><div id="ginner"></div></div>`;
  out.scrollIntoView({behavior:'smooth',block:'nearest'});
  document.getElementById('gaskbtn').onclick=()=>askGenie(document.getElementById('gq').value);
  document.getElementById('gq').addEventListener('keydown',e=>{if(e.key==='Enter')askGenie(e.target.value);});
  document.getElementById('gq').focus();
}
async function askAI(q){if(!q||!q.trim())return;document.getElementById('aiout').innerHTML='<div class="load">Routing your question…</div>';
  try{const r=await API('/api/ai/ask',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({question:q})});renderAI(r);}catch(e){document.getElementById('aiout').innerHTML=`<div class="err">${e.message}</div>`;}}
async function askSpecialist(k){document.getElementById('aiout').innerHTML='<div class="load">Asking…</div>';
  try{const r=await API('/api/ai/ask',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({specialist:k})});renderAI(r);}catch(e){document.getElementById('aiout').innerHTML=`<div class="err">${e.message}</div>`;}}
function servedPill(r){const s=r.served_by;
  if(s==='agent_endpoint')return '<span class="pill pill-green" style="margin-left:6px">agent endpoint</span>';
  if(s==='cache')return '<span class="pill pill-slate" style="margin-left:6px">cached</span>';
  return '<span class="pill pill-amber" style="margin-left:6px">FMAPI fallback</span>';}
function renderAI(r){document.getElementById('aiout').innerHTML=`
  <div style="margin-bottom:6px"><span class="pill pill-violet">${r.specialist_name}</span>
    ${r.reason?`<span style="color:var(--mut);font-size:12px;margin-left:8px">routed: ${r.reason}${r.confidence?` (${Math.round(r.confidence*100)}%)`:''}</span>`:''}
    ${servedPill(r)}</div>
  <div class="brief"><span class="tag">${r.specialist_name} · ${r.model||''}</span>${(r.text||'').replace(/</g,'&lt;')}</div>`;}
async function askGenie(q){if(!q||!q.trim())return;const tgt=document.getElementById('ginner')||document.getElementById('gout');
  tgt.innerHTML='<div class="load">Asking Genie (Conversation API)…</div>';
  try{const r=await API('/api/genie/ask',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({question:q})});
    let h=`<div class="brief"><span class="tag">Genie · Conversation API</span>${(r.answer||'').replace(/</g,'&lt;')}</div>`;
    if(r.sql)h+=`<div class="mono" style="margin-top:8px;background:#f8fafc;border:1px solid var(--line);border-radius:8px;padding:10px;font-size:11.5px;white-space:pre-wrap">${r.sql.replace(/</g,'&lt;')}</div>`;
    if(r.rows&&r.rows.length){h+=`<table style="margin-top:10px"><thead><tr>${(r.columns||[]).map(c=>`<th>${c}</th>`).join('')}</tr></thead><tbody>${r.rows.slice(0,10).map(row=>`<tr>${row.map(c=>`<td>${c==null?'':c}</td>`).join('')}</tr>`).join('')}</tbody></table>`;}
    tgt.innerHTML=h;
  }catch(e){(document.getElementById('ginner')||document.getElementById('gout')).innerHTML=`<div class="err">${e.message}</div>`;}}

      <div class="z mid"><div class="zt">back-test</div><div class="zd">Replay methods at past valuations; refresh accuracy.</div></div>

async function signOff(lob){const m=document.getElementById('somsg');m.textContent='Signing off '+lob+'…';
  try{const r=await API('/api/signoff',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({lob})});

  catch(e){m.textContent='sign-off failed: '+e.message;}}
