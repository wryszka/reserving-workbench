<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Reserving Workbench — Bricksurance SE</title>
<style>
  :root{
    --slate:#1e293b; --slate2:#0f172a; --blue:#2563eb; --blue4:#60a5fa; --blue7:#1d4ed8;
    --ink:#0f172a; --mut:#64748b; --line:#e2e8f0; --bg:#f8fafc; --card:#fff;
    --red:#dc2626; --redbg:#fef2f2; --amber:#d97706; --ambbg:#fffbeb;
    --green:#16a34a; --greenbg:#f0fdf4; --violet:#6d28d9; --violetbg:#ede9fe;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    color:var(--ink);background:var(--bg);font-size:13px;line-height:1.55}
  .app{display:flex;min-height:100vh}
  /* sidebar */
  .sidebar{width:264px;background:linear-gradient(180deg,#1e293b 0%,#172033 100%);color:#cbd5e1;
    flex-shrink:0;display:flex;flex-direction:column;position:fixed;height:100vh;
    border-right:1px solid rgba(255,255,255,.06);z-index:5}
  .brand{display:flex;align-items:center;gap:11px;padding:16px;border-bottom:1px solid rgba(255,255,255,.08);cursor:pointer;color:inherit}
  .brand:hover{background:rgba(255,255,255,.03)}
  .logo{width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,#2563eb,#60a5fa);
    display:flex;align-items:center;justify-content:center;flex-shrink:0;box-shadow:0 2px 10px rgba(37,99,235,.4);color:#fff;font-weight:800}
  .brand .bt{font-weight:700;color:#fff;font-size:14px} .brand .bs{font-size:11px;color:#94a3b8;margin-top:1px}
  .nav{flex:1;padding:6px 10px;overflow:auto}
  .nav-section{font-size:10px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:#5b6878;padding:15px 10px 5px}
  .nav a{display:flex;align-items:center;gap:11px;padding:8.5px 11px;border-radius:9px;color:#cbd5e1;
    text-decoration:none;font-size:13.5px;margin:1px 0;cursor:pointer;transition:background .12s,color .12s}
  .nav a:hover{background:rgba(255,255,255,.06);color:#fff}
  .nav a.active{background:linear-gradient(135deg,#2563eb,#3b82f6);color:#fff;font-weight:600;box-shadow:0 2px 8px rgba(37,99,235,.35)}
  .nav a .ic{width:18px;text-align:center;opacity:.9}
  .side-foot{padding:14px 16px;border-top:1px solid rgba(255,255,255,.08);font-size:11px;color:#7c8797}
  .side-foot .st{display:inline-block;margin-top:6px;padding:2px 8px;border-radius:999px;background:rgba(251,191,36,.14);
    color:#fbbf24;font-weight:700;font-size:10px;letter-spacing:.04em}
  /* main */
  .main{margin-left:264px;flex:1;padding:26px 34px;max-width:1200px}
  h1{font-size:24px;font-weight:700;margin:0 0 3px}
  .sub{color:var(--mut);margin:0 0 18px;font-size:13.5px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px 20px;margin-bottom:18px}
  .card h2{font-size:15px;font-weight:700;margin:0 0 3px}
  .card .h-sub{color:var(--mut);font-size:12.5px;margin:0 0 14px}
  .row{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:18px}
  .tile{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:15px 17px;flex:1;min-width:160px}
  .tile .k{color:var(--mut);font-size:12px} .tile .v{font-size:26px;font-weight:700;margin-top:4px;color:var(--ink)}
  .tile .v.sm{font-size:20px}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line)}
  th{color:var(--mut);font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.04em}
  td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
  .tri td{font-variant-numeric:tabular-nums;text-align:right} .tri td:first-child{text-align:left;font-weight:600}
  .tri th{text-align:right} .tri th:first-child{text-align:left}
  .tri .obs{background:#eff6ff} .tri .fut{color:#cbd5e1}
  .frow td{font-weight:700;color:var(--blue7);background:#f8fafc}
  .anom{color:var(--red);font-weight:700;background:var(--redbg)}
  .pill{display:inline-block;padding:2px 9px;border-radius:999px;font-size:11px;font-weight:700}
  .pill-green{background:var(--greenbg);color:var(--green)} .pill-amber{background:var(--ambbg);color:var(--amber)}
  .pill-red{background:var(--redbg);color:var(--red)} .pill-blue{background:#dbeafe;color:var(--blue7)}
  .pill-slate{background:#e2e8f0;color:#334155} .pill-violet{background:var(--violetbg);color:var(--violet)}
  .btn{padding:8px 14px;border-radius:8px;background:var(--blue);color:#fff;border:0;cursor:pointer;
    font-size:12.5px;font-weight:700;transition:background .12s}
  .btn:hover{background:var(--blue7)} .btn:disabled{opacity:.5;cursor:default}
  .explain{background:linear-gradient(90deg,#eef2ff,#faf5ff);border:1px solid #ddd6fe;border-radius:10px;
    padding:11px 15px;margin:0 0 16px;font-size:12.5px;color:#4338ca;line-height:1.6}
  .explain b{color:#312e81}
  details.why{margin-top:10px} details.why summary{cursor:pointer;color:var(--blue);font-size:12.5px;font-weight:600}
  details.why div{color:var(--mut);margin-top:7px;font-size:12.5px}
  .about{background:var(--ambbg);border:1px solid #fde68a;border-radius:12px;padding:14px 18px;
    font-size:12.5px;color:#92400e;line-height:1.6;margin-top:24px}
  .mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px}
  .seam{display:flex;align-items:stretch;gap:0;margin:6px 0 2px;flex-wrap:wrap}
  .seam .z{flex:1;min-width:180px;border:1px solid var(--line);border-radius:10px;padding:12px 14px;background:#f8fafc}
  .seam .z.mid{border-color:var(--blue4);background:#eff6ff}
  .seam .arrow{align-self:center;color:var(--mut);padding:0 10px;font-size:18px}
  .z .zt{font-weight:700;font-size:12.5px;color:var(--ink)} .z .zd{color:var(--mut);font-size:11.5px;margin-top:4px}
  .brief{background:#f8fafc;border:1px solid var(--line);border-left:3px solid var(--violet);border-radius:8px;
    padding:14px 16px;font-size:13.5px;line-height:1.6;white-space:pre-wrap}
  .brief .tag{font-size:10.5px;color:var(--mut);text-transform:uppercase;letter-spacing:.05em;margin-bottom:8px;display:block}
  .load{color:var(--mut);font-size:13px;padding:8px 0}
  .err{background:var(--redbg);border:1px solid #fecaca;color:#991b1b;border-radius:10px;padding:12px 15px;font-size:12.5px}
  select{background:#fff;color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:7px 11px;font-size:13px}
  .lin{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:10px 0}
  .lin .node{background:#f8fafc;border:1px solid var(--line);border-radius:8px;padding:8px 12px;font-size:12px}
  .lin .node.on{border-color:var(--green);background:var(--greenbg)} .lin .a{color:var(--mut);font-size:16px}
  iframe{width:100%;height:680px;border:0;border-radius:10px}
  .step-table td:nth-child(2){white-space:normal}
</style>
</head>
<body>
<div class="app">
  <div class="sidebar">
    <div class="brand" onclick="go('overview')">
      <div class="logo">△</div>
      <div><div class="bt">Reserving Workbench</div><div class="bs" id="entity">Bricksurance SE</div></div>
    </div>
    <div class="nav" id="nav"></div>
    <div class="side-foot">
      <div style="display:flex;gap:6px;margin-bottom:8px">
        <button id="cacheBtn" onclick="toggleCache()" style="flex:1;font-size:10.5px;font-weight:700;padding:6px;border-radius:7px;border:1px solid rgba(52,211,153,.4);background:rgba(52,211,153,.12);color:#34d399;cursor:pointer">AI: cached</button>
        <button onclick="resetDemo()" style="flex:1;font-size:10.5px;font-weight:700;padding:6px;border-radius:7px;border:1px solid rgba(148,163,184,.3);background:rgba(148,163,184,.1);color:#cbd5e1;cursor:pointer">Reset demo</button>
      </div>
      <span id="resetmsg" style="font-size:10.5px;color:#7c8797"></span>
      Synthetic demo · governed on Databricks
      <br><span class="st">IN PROGRESS</span>
    </div>
  </div>
  <div class="main" id="main"><div class="load">Loading…</div></div>
</div>
<script>
const API=(p,o)=>fetch(p,o).then(async r=>{if(!r.ok){throw new Error('HTTP '+r.status+' on '+p);}return r.json();});
const fmt=(n)=> n==null||n===''?'—':Number(n).toLocaleString('en-GB',{maximumFractionDigits:0});
const money=(n)=> n==null||n===''?'—':'£'+fmt(n);
let CFG={};

const PAGES=[
  ["overview","Today — close cockpit","▤"],
  ["triangle","Triangle & LDF selection","△"],
  ["methodology","Methodology library","▦"],
  ["estimates","Reserve estimates","∑"],
  ["variability","Reserve ranges","∿"],
  ["largeloss","Large-loss review","◎"],
  ["diagnostics","Validation diagnostics","◫"],
  ["movement","Movement & roll-forward","⇅"],
  ["judgements","Expert judgement","⚖"],
  ["committee","Committee","◆"],
  ["ai","Workbench AI","✦"],
  ["genie","Ask the Triangle","✦"],
  ["engines","External engines (ResQ)","⚙"],
  ["governance","Governance & sign-off","⬡"],
  ["learn","Learn","✎"],
  ["assets","Assets","▦"],
];
// nav section boundaries (after which key a section header is inserted)
const NAV_SECTIONS={overview:"Reserving process", ai:"AI & governance"};
let CURRENT="overview", LOB="COMMERCIAL_PROPERTY";

function renderNav(){
  const nav=document.getElementById('nav'); nav.innerHTML='<div class="nav-section">Reserving process</div>';
  PAGES.forEach(([id,label,ic])=>{
    if(NAV_SECTIONS[id]&&id!=='overview'){const s=document.createElement('div');s.className='nav-section';s.textContent=NAV_SECTIONS[id];nav.appendChild(s);}
    const a=document.createElement('a'); a.className=(id===CURRENT?'active':'');
    a.innerHTML=`<span class="ic">${ic}</span> ${label}`; a.onclick=()=>go(id); nav.appendChild(a);
  });
}
function go(id){CURRENT=id;renderNav();route();}
let CACHE_ON=true;
async function toggleCache(){
  const r=await API('/api/ai/cache/toggle',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({on:!CACHE_ON})});
  CACHE_ON=r.use_cache; const b=document.getElementById('cacheBtn');
  b.textContent='AI: '+(CACHE_ON?'cached':'live');
  b.style.color=CACHE_ON?'#34d399':'#fbbf24'; b.style.borderColor=CACHE_ON?'rgba(52,211,153,.4)':'rgba(251,191,36,.45)';
  b.style.background=CACHE_ON?'rgba(52,211,153,.12)':'rgba(251,191,36,.12)';
}
async function resetDemo(){
  const m=document.getElementById('resetmsg'); m.textContent='Resetting…';
  try{const r=await API('/api/reset',{method:'POST'}); m.textContent='✓ reset ('+(r.actions||[]).length+' actions)'; setTimeout(()=>{m.textContent='';route();},1500);}
  catch(e){m.textContent='reset failed';}
}
const main=(h)=>document.getElementById('main').innerHTML=h;
const explain=(h)=>`<div class="explain"><b>What am I seeing?</b> ${h}</div>`;
const ABOUT=`<div class="about"><b>About this demo.</b> Bricksurance SE is fictional and all data is synthetic. This workbench demonstrates the <i>platform pattern</i> for governed reserving on Databricks — the methodology is illustrative, not a certified actuarial model. Every panel reads a real Unity Catalog table, view or function.</div>`;

async function route(){
  main('<div class="load">Loading…</div>');
  try{ await PAGE[CURRENT](); }
  catch(e){ main(`<h1>${(PAGES.find(p=>p[0]===CURRENT)||['','Page'])[1]}</h1><div class="err">Couldn't load this page: ${e.message}. The app may be waking up — try again in a moment.</div>`); }
}
const PAGE={};

PAGE.overview=async()=>{
  const [a,lc]=await Promise.all([API('/api/attention'),API('/api/lifecycle')]);
  const t=a.totals||{};
  const stbadge=(s)=> s==='built'?'<span class="pill pill-green">built</span>':'<span class="pill pill-amber">next</span>';
  const topBreach=(a.breaches||[])[0];
  main(`<h1>Today — Q4 close cockpit</h1>
  <p class="sub">Valuation ${a.valuation_date}. What needs your attention this close.</p>
  ${explain(`This is the reserving actuary's Monday-morning view of close week. The triangle is already built and reconciling — no weekend in Excel. The platform points you at the one cohort that needs judgment, tracks what's still pending, and carries the whole process (data · engines · agents · governance) end to end, the same shape as the pricing workbench.`)}
  <div class="row">
    <div class="tile"><div class="k">Best-estimate ultimate</div><div class="v">${money(t.ultimate)}</div></div>
    <div class="tile"><div class="k">IBNR</div><div class="v">${money(t.ibnr)}</div></div>
    <div class="tile"><div class="k">Pending selections</div><div class="v">${a.pending_selections}</div></div>
    <div class="tile"><div class="k">Pending sign-offs</div><div class="v">${a.pending_signoffs}</div></div>
  </div>
  <div class="card" style="border-color:#fecaca;background:#fffbfb"><h2>⚠ Needs your attention</h2>
  <div class="h-sub">The platform flagged these — you didn't have to eyeball 40 triangles.</div>
    ${(a.breaches||[]).map(b=>`<div style="display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)">
      <div><b>${b.line_of_business_code.replace(/_/g,' ')} — AY ${b.accident_year}</b> <span style="color:var(--mut)">breached actual-vs-expected validation</span></div>
      <div style="display:flex;gap:12px;align-items:center"><span class="pill pill-red">resid ${Number(b.standardised_residual).toFixed(2)}</span>
      <button class="btn" style="padding:5px 11px" onclick="go('triangle')">Review →</button></div></div>`).join('')||'<div style="color:var(--green)">Nothing outside tolerance — clean close.</div>'}
    ${a.large_losses>0?`<div style="margin-top:10px;color:var(--mut);font-size:12.5px">${a.large_losses} large loss flagged for individual treatment (distorts a factor).</div>`:''}
  </div>
  <div class="row">
    <div class="card" style="flex:1;min-width:280px"><h2>Sign-off status</h2><div class="h-sub">Where each line stands for this close.</div>
      <table><thead><tr><th>Line of business</th><th class="num">Best estimate</th><th>Status</th></tr></thead><tbody>
      ${(a.signoff||[]).map(s=>`<tr><td>${s.line_of_business_code.replace(/_/g,' ')}</td><td class="num">${money(s.signed_best_estimate)}</td><td><span class="pill ${s.status_code==='APPROVED'?'pill-green':'pill-amber'}">${s.status_code==='APPROVED'?'signed':'pending'}</span></td></tr>`).join('')}
      </tbody></table></div>
    <div class="card" style="flex:1;min-width:280px"><h2>Two ways in</h2><div class="h-sub">The same triangle machinery, two teams.</div>
      <div style="padding:10px 0;border-bottom:1px solid var(--line)"><b>Reserving actuary</b> — book the reserve: select factors, validate, judge, sign off. <a onclick="go('triangle')" style="cursor:pointer">Start →</a></div>
      <div style="padding:10px 0"><b>Pricing analyst</b> — develop losses to ultimate for the rate <b>indication</b>. Same triangle, feeds the indicated rate not the balance sheet. <a onclick="go('triangle')" style="cursor:pointer">Start →</a></div>
    </div>
  </div>
  <details class="why"><summary>The full lifecycle (${lc.built}/${lc.total} stages built)</summary>
  <table class="step-table" style="margin-top:8px"><thead><tr><th>Stage</th><th>What it answers</th><th>Status</th></tr></thead><tbody>
  ${lc.stages.map(s=>`<tr><td><b>${s.n} · ${s.stage}</b></td><td>${s.answers}</td><td>${stbadge(s.status)}</td></tr>`).join('')}
  </tbody></table></details>
  ${ABOUT}`);
};

// live state for the decision module (per page load)
let SEL={basis:'VOLUME_WEIGHTED', last_n:5, tail:1.01, overrides:{}, empirical:{}, applied:{}, lags:[], overrode:false};

PAGE.triangle=async()=>{
  const [t,s]=await Promise.all([API('/api/triangle?lob='+encodeURIComponent(LOB)),API('/api/selection?lob='+encodeURIComponent(LOB))]);
  const cell={}; t.cells.forEach(c=>cell[c.ay+'_'+c.lag]={paid:c.paid,incurred:c.incurred});
  const head='<tr><th>AY \\ dev</th>'+t.development_lags.map(l=>`<th>${l}</th>`).join('')+'</tr>';
  const body=t.accident_years.map(ay=>{
    const tds=t.development_lags.map(lag=>{const c=cell[ay+'_'+lag];if(!c)return '<td class="fut">·</td>';
      const obs=(ay+lag)<=2026;return `<td class="${obs?'obs':'fut'}">${fmt(c.paid)}</td>`;}).join('');
    return `<tr><td>${ay}</td>${tds}</tr>`;
  }).join('');
  const indiv=t.accident_years.map(ay=>{const row=t.individual_factors[ay]||{};
    const tds=t.development_lags.map(l=>{const v=row[l],vw=t.empirical_factors[l];if(v==null)return '<td class="fut">·</td>';
      const anom=vw&&v>vw*1.4;return `<td class="${anom?'anom':''}">${v.toFixed(2)}</td>`;}).join('');
    return `<tr><td>${ay}</td>${tds}</tr>`;}).join('');
  const lobOpts=t.lobs.map(l=>`<option value="${l}" ${l===LOB?'selected':''}>${l.replace(/_/g,' ')}</option>`).join('');
  const sels=s.selections||[];
  // reset live state for this LOB
  SEL={basis:'VOLUME_WEIGHTED', last_n:5, tail:1.01, overrides:{}, empirical:{}, applied:{}, lags:t.development_lags.slice(0,-1), overrode:false};

  main(`<h1>Triangle &amp; loss-development-factor selection</h1>
  <p class="sub">Review the triangle, choose an averaging basis, override any factor, and elect — the decision is recorded and reserves recompute live.</p>
  <div style="margin-bottom:14px">Line of business: <select id="lob" name="lob" aria-label="Line of business">${lobOpts}</select></div>
  ${explain(`The upper-left (shaded) cells are observed cumulative paid. The <b>decision module</b> below lets you pick how factors are averaged, <b>edit any factor</b> (e.g. override the anomalous AY2023 step), and <b>elect</b> — the ultimate/IBNR recompute live and your decision is written back as a new audited selection row. This is the stop-and-override moment a black-box SQL script can't offer.`)}
  <div class="card"><h2>Cumulative paid triangle</h2><div class="h-sub">Derived live from the claim ledger (loss_development) — reconciles to the penny.</div>
    <table class="tri"><thead>${head}</thead><tbody>${body}</tbody></table></div>
  <div class="card"><h2>Individual age-to-age factors by accident year</h2><div class="h-sub">The diagnostic behind the selection: a single red cell is the reason to override.</div>
    <table class="tri"><thead>${head}</thead><tbody>${indiv}</tbody></table></div>

  <div class="card" style="border-color:#c7d2fe"><h2>Decision module — select development factors</h2>
  <div class="h-sub">Change the basis or edit a factor; the reserve recomputes live. Then elect and save.</div>
    <div style="display:flex;gap:16px;align-items:flex-end;flex-wrap:wrap;margin-bottom:14px">
      <div><label style="font-size:11px;color:var(--mut);text-transform:uppercase;letter-spacing:.04em;display:block;margin-bottom:4px">Averaging basis</label>
        <select id="basis" name="basis" aria-label="Averaging basis">
          <option value="VOLUME_WEIGHTED">Volume-weighted (all years)</option>
          <option value="SIMPLE_AVERAGE">Simple average</option>
          <option value="LAST_N">Last-N average</option>
          <option value="MEDIAN">Median</option>
          <option value="GEOMETRIC">Geometric</option>
        </select></div>
      <div id="lastnwrap" style="display:none"><label style="font-size:11px;color:var(--mut);text-transform:uppercase;letter-spacing:.04em;display:block;margin-bottom:4px">N years</label>
        <input id="lastn" type="number" value="5" min="1" max="8" style="width:70px;padding:7px;border:1px solid var(--line);border-radius:8px"></div>
      <div><label style="font-size:11px;color:var(--mut);text-transform:uppercase;letter-spacing:.04em;display:block;margin-bottom:4px">Tail factor</label>
        <input id="tail" type="number" value="1.01" step="0.01" min="1" style="width:80px;padding:7px;border:1px solid var(--line);border-radius:8px"></div>
      <button class="btn ghost" id="resetf" style="background:#eef2ff;color:var(--blue)">Reset overrides</button>
    </div>
    <div style="overflow-x:auto"><table class="tri" id="ftable"><thead><tr><th>dev</th>${SEL.lags.map(l=>`<th>${l}→${l+1}</th>`).join('')}</tr></thead>
      <tbody>
        <tr><td>empirical</td><td colspan="${SEL.lags.length}" style="text-align:left;color:var(--mut)" id="emprow">computing…</td></tr>
        <tr class="frow"><td>selected</td>${SEL.lags.map(l=>`<td><input class="fin" data-lag="${l}" type="number" step="0.001" style="width:66px;padding:5px;border:1px solid #c7d2fe;border-radius:6px;text-align:right;font-variant-numeric:tabular-nums"></td>`).join('')}</tr>
      </tbody></table></div>
    <div class="row" style="margin-top:16px;margin-bottom:0">
      <div class="tile"><div class="k">Selected ultimate</div><div class="v sm" id="r_ult">—</div></div>
      <div class="tile"><div class="k">Selected IBNR</div><div class="v sm" id="r_ibnr">—</div></div>
      <div class="tile"><div class="k">Δ vs prior selection</div><div class="v sm" id="r_delta">—</div></div>
    </div>
    <div style="margin-top:14px">
      <label style="font-size:11px;color:var(--mut);text-transform:uppercase;letter-spacing:.04em;display:block;margin-bottom:4px">Rationale <span id="ratreq" style="color:var(--red);display:none">(required for an override)</span></label>
      <textarea id="rationale" name="rationale" aria-label="Rationale" rows="2" placeholder="e.g. Held the prior 12–24m factor: AY2023 empirical spike is one late-reported large loss, reserved individually." style="width:100%;padding:9px;border:1px solid var(--line);border-radius:8px;font-family:inherit;font-size:13px"></textarea>
    </div>
    <div style="margin-top:12px;display:flex;gap:10px;align-items:center">
      <button class="btn" id="elect">Elect &amp; save selection</button>
      <span id="electmsg" style="font-size:12.5px;color:var(--mut)"></span>
    </div>
  </div>

  <div class="card"><h2>Selection audit trail</h2>
  <div class="h-sub">Every election recorded: who, when, source, why. New selection = new row; the prior is never overwritten.</div>
    <div id="audit">${renderAudit(sels)}</div>
    <details class="why"><summary>Why does this matter?</summary><div>Pricing actuaries develop losses to ultimate for rate indications; reserving actuaries for booked reserves — the same triangle machinery. The override moment (holding a prior pattern when a data anomaly distorts the empirical factor) is exactly the human-in-the-loop control a black-box SQL script cannot offer, and every decision is audit-trailed here.</div></details>
  </div>
  ${ABOUT}`);

  document.getElementById('lob').onchange=(e)=>{LOB=e.target.value;route();};
  document.getElementById('basis').onchange=(e)=>{SEL.basis=e.target.value;SEL.overrides={};
    document.getElementById('lastnwrap').style.display=(SEL.basis==='LAST_N')?'block':'none';recompute(true);};
  document.getElementById('lastn').onchange=(e)=>{SEL.last_n=parseInt(e.target.value)||5;recompute(true);};
  document.getElementById('tail').onchange=(e)=>{SEL.tail=parseFloat(e.target.value)||1.01;recompute(false);};
  document.getElementById('resetf').onclick=()=>{SEL.overrides={};recompute(true);};
  document.getElementById('elect').onclick=doElect;
  recompute(true);   // initial compute fills the factor inputs
};

function renderAudit(sels){
  if(!sels||!sels.length) return '<div class="load">No selections recorded for this line yet.</div>';
  return `<table><thead><tr><th>Selection</th><th>Source</th><th>Status</th><th>Rationale</th><th>By</th></tr></thead><tbody>
  ${sels.map(x=>`<tr><td class="mono">${x.selection_id}</td><td><span class="pill ${x.source_code==='RESQ'?'pill-violet':(x.source_code==='MANUAL'?'pill-amber':'pill-slate')}">${x.source_code}</span></td><td><span class="pill ${x.status_code==='APPROVED'?'pill-green':(x.status_code==='RETIRED'?'pill-slate':'pill-blue')}">${x.status_code}</span></td><td style="color:var(--mut)">${x.rationale||'—'}</td><td>${x.approved_by||x.selected_by}</td></tr>`).join('')}
  </tbody></table>`;
}

async function recompute(refillInputs){
  try{
    const r=await API('/api/selection/compute',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({lob:LOB,basis:SEL.basis,last_n:SEL.last_n,tail:SEL.tail,overrides:SEL.overrides})});
    SEL.empirical=r.empirical_factors; SEL.applied=r.applied_factors;
    // empirical row — always target the first row of the factor table (id-independent, idempotent)
    const emp=SEL.lags.map(l=>{const f=r.empirical_factors[l];return `<td>${f!=null?Number(f).toFixed(3):'—'}</td>`;}).join('');
    const tb=document.querySelector('#ftable tbody'); if(tb&&tb.rows[0]) tb.rows[0].innerHTML=`<td>empirical</td>${emp}`;
    // selected inputs — refill only when basis changed (preserve manual edits otherwise)
    if(refillInputs){
      document.querySelectorAll('.fin').forEach(inp=>{const l=inp.dataset.lag;
        inp.value=(SEL.overrides[l]!=null?SEL.overrides[l]:r.applied_factors[l]);
        inp.oninput=()=>{const v=parseFloat(inp.value);
          if(isNaN(v)){delete SEL.overrides[inp.dataset.lag];}else{SEL.overrides[inp.dataset.lag]=v;}
          SEL.overrode=Object.keys(SEL.overrides).length>0;markOverride();recomputeReserveOnly();};
      });
    }
    SEL.overrode=Object.keys(SEL.overrides).length>0;
    markOverride();
    paintReserve(r.reserve, r.prior_reserve);
  }catch(e){
    const m=document.getElementById('electmsg'); if(m) m.innerHTML=`<span style="color:#dc2626">Recompute failed: ${e.message}</span>`;
  }
}

async function recomputeReserveOnly(){
  try{
    const r=await API('/api/selection/compute',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({lob:LOB,basis:SEL.basis,last_n:SEL.last_n,tail:SEL.tail,overrides:SEL.overrides})});
    paintReserve(r.reserve, r.prior_reserve);
  }catch(e){}
}

function markOverride(){
  document.getElementById('ratreq').style.display=SEL.overrode?'inline':'none';
  document.querySelectorAll('.fin').forEach(inp=>{const l=inp.dataset.lag;
    inp.style.borderColor=(SEL.overrides[l]!=null)?'#d97706':'#c7d2fe';
    inp.style.background=(SEL.overrides[l]!=null)?'#fffbeb':'#fff';});
}

function paintReserve(res, prior){
  document.getElementById('r_ult').textContent=money(res.ultimate);
  document.getElementById('r_ibnr').textContent=money(res.ibnr);
  const el=document.getElementById('r_delta');
  if(prior){const d=res.ultimate-prior.ultimate; const pct=prior.ultimate?(d/prior.ultimate*100):0;
    el.innerHTML=`<span style="color:${d>0?'#dc2626':'#16a34a'}">${d>=0?'+':''}${money(d)}</span> <span style="font-size:12px;color:var(--mut)">(${pct>=0?'+':''}${pct.toFixed(1)}%)</span>`;
  } else el.textContent='—';
}

async function doElect(ev){
  const btn=ev.target, msg=document.getElementById('electmsg');
  const factors=SEL.lags.map(l=>{const inp=document.querySelector(`.fin[data-lag="${l}"]`);return parseFloat(inp.value);});
  const rationale=document.getElementById('rationale').value;
  if(SEL.overrode && rationale.trim().length<10){msg.innerHTML='<span style="color:#dc2626">An override needs a rationale (≥10 chars).</span>';return;}
  btn.disabled=true; msg.textContent='Saving selection…';
  try{
    const r=await API('/api/selection/elect',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({lob:LOB,factors,tail:SEL.tail,basis:SEL.basis,overrode:SEL.overrode,rationale})});
    if(!r.ok){msg.innerHTML=`<span style="color:#dc2626">${r.error}</span>`;btn.disabled=false;return;}
    msg.innerHTML=`<span style="color:#16a34a">✓ Saved ${r.selection_id} (${r.source}, ${r.status}) — ultimate ${money(r.reserve.ultimate)}. Refreshing audit trail…</span>`;
    const s=await API('/api/selection?lob='+encodeURIComponent(LOB));
    document.getElementById('audit').innerHTML=renderAudit(s.selections||[]);
  }catch(e){msg.innerHTML=`<span style="color:#dc2626">Save failed: ${e.message}</span>`;}
  btn.disabled=false;
}

  </div>
  <div class="card"><h2>The specialists</h2><div class="h-sub">Each is a governed FMAPI agent grounded on specific tables.</div>
    <div id="specgrid"></div>
  </div>${ABOUT}`);
  // load specialist list from a probe call
  const probe=await API('/api/ai/ask',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({specialist:'senior_reserving'})});
  const specs=probe.specialists||[];
  document.getElementById('specs').innerHTML=specs.map(s=>`<button class="btn ghost" style="background:#eef2ff;color:var(--blue);margin:2px 4px 2px 0;font-size:11.5px;padding:5px 10px" onclick="askSpecialist('${s.key}')">${s.name}</button>`).join('');
  document.getElementById('specgrid').innerHTML=specs.map(s=>`<div style="padding:9px 0;border-bottom:1px solid var(--line)"><b>${s.name}</b> <span style="color:var(--mut);font-size:12.5px">— ${s.scope}</span></div>`).join('');
  renderAI(probe);
  document.getElementById('askbtn').onclick=()=>askAI(document.getElementById('q').value);
  document.getElementById('q').addEventListener('keydown',e=>{if(e.key==='Enter')askAI(e.target.value);});
};
async function askAI(q){if(!q||!q.trim())return;document.getElementById('aiout').innerHTML='<div class="load">Routing your question…</div>';
  try{const r=await API('/api/ai/ask',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({question:q})});renderAI(r);}catch(e){document.getElementById('aiout').innerHTML=`<div class="err">${e.message}</div>`;}}
async function askSpecialist(k){document.getElementById('aiout').innerHTML='<div class="load">Asking…</div>';
  try{const r=await API('/api/ai/ask',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({specialist:k})});renderAI(r);}catch(e){document.getElementById('aiout').innerHTML=`<div class="err">${e.message}</div>`;}}
function renderAI(r){document.getElementById('aiout').innerHTML=`
  <div style="margin-bottom:6px"><span class="pill pill-violet">${r.specialist_name}</span>
    ${r.reason?`<span style="color:var(--mut);font-size:12px;margin-left:8px">routed: ${r.reason}${r.confidence?` (${Math.round(r.confidence*100)}%)`:''}</span>`:''}
    ${r.cached?'<span class="pill pill-slate" style="margin-left:6px">cached</span>':'<span class="pill pill-green" style="margin-left:6px">live</span>'}</div>
  <div class="brief"><span class="tag">${r.specialist_name} · ${r.model}</span>${(r.text||'').replace(/</g,'&lt;')}</div>`;}

PAGE.governance=async()=>{
  const g=await API('/api/governance');
  const rec=g.reconciliation||{};
  main(`<h1>Governance &amp; sign-off</h1><p class="sub">Every data point reconciled, every action logged, every model versioned.</p>
  ${explain(`The governance spine. The triangle reconciles to the ledger to the penny; every selection, judgement, sign-off and agent call is logged with who/when/why; every method is a versioned UC model. Sign-off records the as-at data version so the whole basis is reproducible for the auditor — the actuary can put their name to the number and defend it.`)}
  <div class="row">
    <div class="tile"><div class="k">Triangle ↔ ledger reconciliation</div><div class="v sm" style="color:${rec.ties?'#16a34a':'#dc2626'}">${rec.ties?'✓ ties to the penny':'✗ break'}</div><div style="color:var(--mut);font-size:11.5px;margin-top:4px">${money(rec.triangle_paid)} = ${money(rec.ledger_paid)}</div></div>
    <div class="tile"><div class="k">Actions logged</div><div class="v sm">${(g.audit||[]).length}+</div></div>
    <div class="tile"><div class="k">Models versioned</div><div class="v sm">${(g.models||[]).length}</div></div>
  </div>
  <div class="card"><h2>Sign-off &amp; reproduce-as-at</h2><div class="h-sub">Put your name to the number. The data version makes it reproducible for the auditor.</div>
    <table><thead><tr><th>LOB</th><th class="num">Signed estimate</th><th>Method</th><th>Data version</th><th>Status</th><th>By</th><th></th></tr></thead><tbody>
    ${(g.signoff||[]).map(s=>`<tr><td>${s.line_of_business_code.replace(/_/g,' ')}</td><td class="num">${money(s.signed_best_estimate)}</td><td>${s.reserving_method_code.replace(/_/g,' ')}</td><td class="mono" style="font-size:11px">${s.data_version}</td><td><span class="pill ${s.status_code==='APPROVED'?'pill-green':'pill-amber'}">${s.status_code==='APPROVED'?'signed':'pending'}</span></td><td>${s.signed_by||'—'}</td><td>${s.status_code==='APPROVED'?'':`<button class="btn" style="padding:5px 10px" onclick="signOff('${s.line_of_business_code}')">Sign off</button>`}</td></tr>`).join('')}
    </tbody></table><span id="somsg" style="font-size:12.5px;color:var(--mut)"></span>
  </div>
  <div class="card"><h2>Model registry</h2><div class="h-sub">Every method is a versioned Unity Catalog model.</div>
    <table><thead><tr><th>Method</th><th>UC model</th><th class="num">Version</th><th>Alias</th><th>Owner</th></tr></thead><tbody>
    ${(g.models||[]).map(m=>`<tr><td>${m.reserving_method_code.replace(/_/g,' ')}</td><td class="mono">${m.uc_model_name.split('.').pop()}</td><td class="num">${m.model_version}</td><td><span class="pill pill-green">${m.alias||'—'}</span></td><td>${m.owner_role}</td></tr>`).join('')}
    </tbody></table></div>
  <div class="card"><h2>Audit trail — every action</h2><div class="h-sub">Append-only. Who, when, what.</div>
    <table><thead><tr><th>When</th><th>Action</th><th>Object</th><th>Detail</th><th>By</th></tr></thead><tbody>
    ${(g.audit||[]).map(e=>`<tr><td class="mono" style="font-size:11px">${(e.created_at||'').slice(0,19).replace('T',' ')}</td><td><span class="pill pill-slate">${e.event_type.replace(/_/g,' ')}</span></td><td class="mono" style="font-size:11px">${e.entity_id||'—'}</td><td style="color:var(--mut);font-size:12px">${(e.detail||'').slice(0,90)}</td><td>${e.actor}</td></tr>`).join('')}
    </tbody></table></div>${ABOUT}`);
}
async function signOff(lob){const m=document.getElementById('somsg');m.textContent='Signing off '+lob+'…';
  try{const r=await API('/api/signoff',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({lob})});
    if(r.ok){m.innerHTML=`<span style="color:#16a34a">✓ ${lob.replace(/_/g,' ')} signed off by ${r.signed_by}. Refreshing…</span>`;setTimeout(()=>PAGE.governance(),900);}else m.textContent=r.error;}
  catch(e){m.textContent='sign-off failed: '+e.message;}}

PAGE.learn=async()=>{
  const l=await API('/api/learn');
  main(`<h1>Learn — reserving on Databricks</h1><p class="sub">The process, the terms, and how the platform maps to them. ~8-minute read.</p>
  ${explain(`A plain-language walk through the reserving process and how each step appears in this workbench — for the semi-technical actuary and for anyone new to reserving.`)}
  ${l.panels.map(p=>`<div class="card"><div style="font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--mut);font-weight:700">Panel ${p.n}</div><h2 style="margin-top:2px">${p.title}</h2><div style="color:#334155;line-height:1.65;margin-top:6px">${p.body}</div></div>`).join('')}
  <div class="card"><h2>Q&amp;A armour</h2><div class="h-sub">Deflections for the hard questions.</div>
    <div style="color:var(--mut);font-size:12.5px;line-height:1.7">
    <b style="color:var(--ink)">"Is the methodology certified?"</b> — No; it's illustrative, demonstrating the platform pattern. Your methods plug in as governed models; the workbench is methodology-agnostic.<br>
    <b style="color:var(--ink)">"Our data isn't this clean."</b> — The triangle is a view; point it at your ledger (or federate to it) and it reconciles to whatever's there.<br>
    <b style="color:var(--ink)">"Does this replace ResQ?"</b> — No. The selection step is a pluggable seam; keep your tool and let Databricks own the data, governance and downstream.<br>
    <b style="color:var(--ink)">"Does the AI make the decision?"</b> — No. The AI drafts and surfaces; the actuary decides, and every decision is audit-trailed.</div>
  </div>${ABOUT}`);
};

PAGE.assets=async()=>{
  const a=await API('/api/assets');
  main(`<h1>Assets &amp; governance</h1><p class="sub">What this workbench owns — every object announces it belongs to reserving-workbench.</p>
  ${explain(`The Unity Catalog objects this workbench owns in <span class="mono">${a.catalog}.${a.schema}</span>. Every table carries a <span class="mono">[reserving-workbench]</span> comment and <span class="mono">bxc_*</span> tags, so in a crowded workspace you can always tell what an asset belongs to — and gen1 → gen2 is a single tag flip.`)}
  <div class="card"><h2>Ownership tags</h2><div style="margin-top:6px">${(a.tags||[]).map(t=>`<span class="pill pill-slate" style="margin:3px 5px 3px 0">${t.tag_name} = ${t.tag_value} (${t.n})</span>`).join('')||'<span class="load">Tag view not available on this warehouse.</span>'}</div></div>
  <div class="card"><h2>Tables &amp; views (${a.tables.length})</h2><table><thead><tr><th>Object</th><th>Comment</th></tr></thead><tbody>
  ${a.tables.map(t=>`<tr><td class="mono">${t.table_name}</td><td style="color:var(--mut);font-size:12px">${(t.comment||'').slice(0,110)}</td></tr>`).join('')}
  </tbody></table></div>${ABOUT}`);
};

(async()=>{
  try{CFG=await API('/api/config'); if(CFG.entity) document.getElementById('entity').textContent=CFG.entity;}catch(e){}
  renderNav(); route();
})();
</script>
